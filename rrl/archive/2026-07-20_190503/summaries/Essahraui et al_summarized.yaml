definitions:
  - term: HBA
    definition: Human Behavior Analysis, the interdisciplinary study of modeling, understanding, and predicting human actions, reactions, and interactions.
  - term: HAR
    definition: Human Activity Recognition, a subfield of HBA focused on detecting and classifying physical activities using sensor data.
  - term: LLM
    definition: Large Language Model, a type of AI model trained on vast text data to understand and generate human-like language.
  - term: FL
    definition: Federated Learning, a decentralized machine learning paradigm that trains models across multiple devices without sharing raw data.
  - term: NLP
    definition: Natural Language Processing, a field of AI focused on the interaction between computers and human language.
