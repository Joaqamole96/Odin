  contribution: This survey provides a foundational synthesis of HBA techniques that can inform Odin's design across multiple modules. The comprehensive review of behavioral profiling and classification approaches (Section V) justifies Odin's use of ML for user segmentation. The detailed analysis of predictive modeling and forecasting algorithms (Section V.H) directly supports the development of Odin's spending forecasting and anomaly detection modules. The thorough discussion of data privacy, security, and ethical frameworks (Section VI.A and VII.E) provides essential guidance for Odin's data governance and user trust strategies. The emerging trends identified, including edge computing and federated learning, offer pathways for Odin's scalable and privacy-preserving deployment.
  directly_justifies:
    - "CNN and LSTM models are effective for time-series analysis of sequential behavioral data."
    - "Federated learning enables privacy-preserving model training across user devices without sharing raw data."
    - "Edge computing enables low-latency real-time behavioral inference on mobile devices."
    - "Autoencoders and anomaly detection models can identify unusual patterns in user behavior."
    - "Data privacy and generalization challenges must be addressed for real-world HBA deployment."
  limits:
    - "Survey covers literature only up to March 2024, potentially missing recent advancements."
    - "Focus on English-language publications may omit significant contributions in other languages."
    - "Heterogeneity in methodologies and evaluation metrics across studies complicates direct performance comparison."
  mapping_rationale: A systematic scan across all 12 functional domains and their associated topic codes was performed. The paper was flagged as highly relevant to Predictive Modeling (6.A, 6.B) and Anomaly Detection (8.A, 8.B) due to its extensive review of forecasting and classification algorithms. It showed medium relevance to Existing Systems & Gaps (4.A, 4.B) and Evaluation (12.A) by identifying limitations and evaluation challenges. High relevance was assigned to Classification Approaches (5.C) and Data Privacy (10.A) due to dedicated sections on these topics. Topics related to Filipino cultural context (2.A, 2.B) and budget recommendation algorithms (7.B) were considered but rejected due to lack of specific discussion. Borderline cases included the paper's coverage of financial decision-making, which touches on both Predictive Modeling (6.A) and User-Declared Preferences (2.C), but was ultimately classified under 6.A due to its algorithmic focus. The overall relevance is high as the survey provides a comprehensive methodological foundation and identifies key challenges directly applicable to designing and evaluating a PFMS like Odin.
limitations:
