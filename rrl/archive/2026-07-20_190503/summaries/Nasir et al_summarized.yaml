tldr: Evaluates supervised learning classifiers on imbalanced bank marketing data, finding XGBoost with BorderlineSMOTE2 significantly improves F-1 and AUC scores.
problem_and_motivation: Imbalanced target variables in big data hinder supervised learning classifier performance, limiting effectiveness in applications like bank target marketing. Restricted availability of real-world imbalanced datasets for classification accentuates research deficiencies.
approach:
  - Applied data analysis, feature engineering (binning, label encoding), and five sampling techniques to a Portuguese bank marketing dataset with 45,211 instances.
  - Implemented Decision Tree, Random Forest, Grid-Search RF, Random-Search RF, AdaBoost, and XGBoost classifiers.
  - Evaluated performance using Accuracy, Precision, Recall, F-1 score, and AUC.
  - Used XGBoost as a baseline to test the impact of Random Over-Sampling, Random Under-Sampling, SMOTE, AdaSyn SMOTE, and BorderlineSMOTE2.
findings:
  - XGBoost outperformed other classifiers on the imbalanced dataset, achieving F-1 and AUC scores of 0.50 and 0.91, respectively.
  - num: BorderlineSMOTE2 with XGBoost yielded the best results, with F-1 score of 0.87 and AUC of 0.94.
  - Grid-Search RF and Random-Search RF excelled in Precision and AUC on the imbalanced data.
  - Features 'durationcat', 'housing', and 'loan' were identified as the most critical for predicting marketing campaign success.
  - num: The target variable was highly imbalanced with 11.69% 'yes' and 88.31% 'no' responses.
  - Applying sampling techniques significantly enhanced the performance of XGBoost across all metrics.
key_figures_tables:
  - Table 7: Results of classifiers performance on imbalanced data → XGBoost has the highest F-1 score of 0.50.
  - Table 8: Results of XGBoost performance after sampling → BorderlineSMOTE2 gives the best F-1 (0.87) and AUC (0.94).
  - Figure 11: Feature importance graph for XGBoost with BorderlineSMOTE2 → 'durationcat' is the most important feature.
