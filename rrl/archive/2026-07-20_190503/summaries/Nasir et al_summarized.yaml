definitions:
  - term: AUC
    definition: Area Under the ROC Curve, a performance metric for classification.
  - term: F-1 score
    definition: Harmonic mean of precision and recall, used to evaluate classifier performance.
  - term: SMOTE
    definition: Synthetic Minority Oversampling Technique, creates synthetic samples for the minority class.
  - term: XGBoost
    definition: Extreme Gradient Boosting, an optimized gradient boosting algorithm.
  - term: BorderlineSMOTE2
    definition: A SMOTE variant that generates synthetic data near the minority class borderline.
