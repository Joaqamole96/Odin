  contribution: The study's systematic evaluation of classifiers and sampling techniques on imbalanced data directly informs the selection of algorithms and preprocessing methods for Odin's behavioral profiling module. The finding that XGBoost with BorderlineSMOTE2 significantly improves F-1 and AUC provides a citable benchmark for handling class imbalance in user spending data. The comparative evaluation of different classifiers (RF, XGBoost, AdaBoost) offers a methodological template for algorithm selection within Odin's forecasting and anomaly detection components.
  directly_justifies:
    - "XGBoost with BorderlineSMOTE2 achieves an F-1 score of 0.87 on imbalanced bank marketing data."
    - "Supervised learning classifiers performance is significantly improved by applying sampling techniques."
    - "Random Forest with hyperparameter tuning excels in Precision and AUC."
    - "Feature engineering, including binning and label encoding, is crucial for classifier performance."
  limits:
    - "The study is limited to a single dataset (bank marketing), which may not generalize to other financial data or domains."
    - "The paper focuses on classification, whereas Odin requires forecasting and recommendation capabilities, which are not directly addressed."
    - "The evaluation is based on a target marketing problem, which differs from personal financial management tasks, such as expense categorization and budget allocation."
  mapping_rationale: A systematic scan across all 12 functional domains and their associated topic codes was performed. Domains flagged as relevant include Behavioral Profiling & Classification (5.B, 5.C) due to the paper's focus on predicting user behavior, and System Evaluation (12.A, 12.B) due to its rigorous comparative methodology. Topic 8.C (Cold‑Start Baseline Strategies for Anomaly Detection) was considered relevant at a low level because the methods for handling imbalanced data could inform baseline anomaly thresholds. Topics like 7.B (Budget Recommendation) and 3.A (Expense Categorization) were considered contextual, as the problem of classifying user responses is analogous but not directly applicable. Domains like Filipino Cultural Context (2.A-2.D), Mobile-First Design (9.A, 9.B), and Data Privacy (10.A, 10.B) were rejected as the paper does not address them. The overall relevance is methodological, offering strong evidence for classifier and sampling technique selection, which is central to Odin's data-driven modules.
