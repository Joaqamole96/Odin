  contribution: |
    This survey provides a systematic evaluation framework for counterfactual explanation algorithms, which can be directly applied to Odin's budget recommendation module to generate actionable spending adjustments. The findings on sparsity, data manifold, and causal constraints inform how Odin should balance feasibility and user preference when suggesting budget changes. The review of existing systems and their gaps, particularly regarding categorical features and user preferences, guides Odin's design to avoid known pitfalls. The emphasis on user trust through transparent recourses supports Odin's user retention and engagement strategies.
  directly_justifies:
    - "CFEs provide a principled method to generate actionable advice from black-box models."
    - "Sparsity constraints ensure suggested budget changes are limited to a few key categories."
    - "Data manifold adherence ensures recommendations are grounded in realistic spending patterns."
    - "Causal constraints prevent infeasible advice like changing immutable features."
  limits:
    - "Focuses on classification, whereas Odin may need regression for spending forecasting."
    - "Assumes static models, while Odin's environment may have concept drift."
    - "User studies in the paper are limited; Odin would require localized user testing."
  mapping_rationale: |
    The systematic scan across all 12 functional domains and their associated topic codes identified 6 relevant topic codes. High relevance was assigned to 7.D (Infeasibility Handling) and 10.B (User Trust) because the paper directly provides algorithms for generating actionable recourses that can handle infeasible budget allocations and transparency frameworks that build user trust. Medium relevance was assigned to 5.C (Behavioral Profiling) and 8.B (Anomaly Detection) because the CFE algorithms are directly applicable to explaining model decisions in these areas. Low relevance was assigned to 6.B (Forecasting) and 1.A (Demographic) as the paper primarily covers classification, though the techniques may extend. Domains like 2.A (Cultural Practices), 3.A (Categorization Frameworks), and 9.B (Mobile UX) were rejected because the paper does not address cultural contexts, category design, or user interfaces. The paper's overall relevance to Odin is high due to its comprehensive coverage of algorithmic recourse, a key requirement for Odin's feedback mechanisms.
limitations:
  - "The survey did not include papers published after May 2022."
  - "Focuses exclusively on tabular data, which may not cover Odin's future multi-modal inputs."
  - "The evaluation frameworks rely on proxy metrics, not direct user studies. [unacknowledged]"
  - "Assumes model access and query budgets that may not hold in production. [unacknowledged]"
  - "The trade-off between diversity and plausibility remains an open challenge. [unacknowledged]"
remember_this:
  - "Valid and sparse CFEs are generated by optimizing proximity to the original input."
  - "Actionability constraints prevent advice that changes immutable features like age or race."
  - "Only 12% of surveyed methods consider both data manifold and causal constraints."
  - "Amortized inference methods are crucial for real-time applications like Odin."
  - "User trust in CFEs increases when explanations are sparse and causally grounded."
