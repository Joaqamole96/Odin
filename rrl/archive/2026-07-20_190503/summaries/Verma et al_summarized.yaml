
paper_id: 10.1145/3677119
designation: international
title: Counterfactual Explanations and Algorithmic Recourses for Machine Learning: A Review
authors: Verma, S.; Boonsanong, V.; Hoang, M.; Hines, K.; Dickerson, J.; Shah, C.
year: 2024
venue: ACM Computing Surveys
odin_topics:
  - 1.A
  - 5.C
  - 6.B
  - 7.D
  - 8.B
  - 10.B
tldr: A comprehensive survey categorizing over 350 counterfactual explanation algorithms for machine learning classifiers.
problem_and_motivation: Machine learning models often make high-stakes decisions without human-understandable explanations. Counterfactual explanations provide actionable feedback to individuals but lack a unified evaluation framework.
approach:
  - Surveyed over 350 papers published up to May 2022 focusing on counterfactual explanations for classifiers on tabular data.
  - Collected papers via snowballing from seminal works and keyword searches on Semantic Scholar and Google Scholar.
  - Assessed algorithms against a rubric of 10 properties including model access, sparsity, data manifold adherence, and causality.
  - Categorized papers by their handling of feature actionability, categorical variables, and evaluation metrics.
findings:
  - num: Most CFE algorithms require per-instance optimization, with only 8 methods offering amortized inference.
  - num: 47% of surveyed algorithms are black-box and model-agnostic.
  - num: Only 12% of methods consider both data manifold adherence and causal feature relations.
  - Causal constraints in CFEs remain under-addressed, with most approaches requiring complete causal graphs.
  - Evaluation metrics often conflict, with diversity traded off against data manifold closeness.
key_figures_tables:
  - Table 1: Assessment of CFE algorithms across model access, optimization amortization, and feature handling → enables easy comparison of algorithm capabilities.
  - Figure 1: Two paths crossing a decision boundary → illustrates trade-off between sparsity and data manifold adherence in CFEs.
key_equations:
  - equation: "\argmin_{x'} \max_{\lambda} (f(x') - y')^2 + d(x, x')"
    explanation: Original optimization formulation for a valid counterfactual.
  - equation: "\argmin_{x' \in A} \max_{\lambda_1, \lambda_2} \lambda_1 (f(x') - y')^2 + \lambda_2 * g(x' - x) + d(x, x')"
    explanation: Loss function extended with sparsity and actionability constraints.
definitions:
  - term: Counterfactual Explanation (CFE)
    definition: An explanation that provides the smallest change to an input to achieve a desired model prediction.
  - term: Algorithmic Recourse
    definition: Actionable feedback that helps an individual change their features to obtain a desirable outcome.
  - term: Actionability
    definition: The property that recommended feature changes must be feasible and under the individual's control.
  - term: Data Manifold
    definition: The underlying distribution of the training data that CFEs should adhere to for plausibility.
critical_citations:
  - "[Wachter et al., 2017] — Seminal paper that formalized CFE optimization for ML models."
  - "[Ustun et al., 2019] — Introduced actionable recourse with causal constraints and fairness implications."
  - "[Verma et al., 2020] — Previous version of this survey establishing the CFE rubric."
  - "[Dandl et al., 2020] — Proposed genetic algorithm for multi-objective diverse CFE generation."
