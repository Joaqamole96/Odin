tldr: "F1-score and MCC outperform accuracy, precision, and recall for evaluating imbalanced business classification models, validated through statistical tests and SHAP-based explainability."
problem_and_motivation: "Imbalanced datasets in business domains like credit risk and churn prediction make standard accuracy-focused metrics unreliable. There is no empirical consensus on which metric offers the most reliable performance under real-world conditions. Existing studies lack a unified, statistically validated framework that accounts for threshold sensitivity, input noise, and interpretability."
approach:
  - "Used two real-world business datasets: Default of Credit Card Clients (30,000 instances) and Telco Customer Churn (7,043 instances)."
  - "Evaluated five models: Logistic Regression, Decision Tree, Random Forest, XGBoost, and k-Nearest Neighbors."
  - "Conducted static and dynamic threshold sensitivity analysis across thresholds from 0.1 to 0.9."
  - "Performed noise robustness testing with Gaussian noise levels from 0.0 to 0.3."
  - "Applied statistical validation using ANOVA, McNemar's test, bootstrap confidence intervals, and Cohen's kappa."
  - "Introduced a novel two-stage SHAP framework, including 3D metric-conditioned SHAP visualizations to link feature importance to threshold and metric variations."
findings:
  - "num: F1-score consistently provides the most stable and balanced evaluation across datasets and testing conditions."
  - "Accuracy and precision demonstrate limited robustness under class imbalance."
  - "MCC offers complementary diagnostic value, but F1-score is more reliable overall."
  - "num: XGBoost achieved the highest F1-score (0.380) and MCC (0.287) on the credit default dataset."
  - "num: XGBoost achieved the highest F1-score (0.562) on the Telco churn dataset."
  - "num: ANOVA showed a highly significant main effect of metric on performance scores (F(4,176) = 77.62, p<0.001)."
  - "Recall was the most unstable metric, with high variability across thresholds and models."
  - "Gaussian noise up to 30% had minimal impact on the F1-score and MCC, confirming their robustness."
  - "Bootstrap confidence intervals for F1-score and MCC were narrower than for accuracy and precision."
  - "SHAP analysis revealed that F1-score and MCC maintain stable feature importance across thresholds, unlike accuracy and precision."
key_figures_tables:
  - "Figure 2: Class distribution of credit card default dataset → Dataset is imbalanced with a minority default class."
  - "Table 5: Baseline model performance → XGBoost achieved the best balance of F1-score (0.380) and MCC (0.287)."
  - "Figure 8: Static threshold sensitivity → F1 and MCC peak at intermediate thresholds (0.3-0.6), showing balanced trade-offs."
  - "Figure 10: Noise robustness testing → RF and LR are most robust to noise, but F1 and MCC remain stable across models."
  - "Figure 15: 3D SHAP analysis → Feature contributions are more stable for F1 and MCC across thresholds than for accuracy or precision."
key_equations:
  - equation: "F1 = 2 * (Precision * Recall) / (Precision + Recall)"
    explanation: "Harmonic mean balancing precision and recall."
  - equation: "MCC = (TP*TN - FP*FN) / sqrt((TP+FP)(TP+FN)(TN+FP)(TN+FN))"
    explanation: "Balanced correlation coefficient using all confusion matrix elements."
  - equation: "S_i(t) = (1/n) * sum(|phi_{i,j}(t)|)"
    explanation: "Metric-conditioned SHAP importance at threshold t."
definitions:
  - term: "MCC"
    definition: "Matthews Correlation Coefficient, a balanced metric for imbalanced classification."
  - term: "SHAP"
    definition: "SHapley Additive exPlanations, a game-theoretic approach for model interpretability."
  - term: "XAI"
    definition: "Explainable Artificial Intelligence, methods to interpret model predictions."
  - term: "ANOVA"
    definition: "Analysis of Variance, statistical test for differences between group means."
