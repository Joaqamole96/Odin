  contribution: "This paper provides a statistically validated framework for selecting performance metrics in imbalanced classification, which is directly applicable to Odin's evaluation module. The recommendation of F1-score and MCC as robust metrics informs how Odin's budget recommendation and anomaly detection systems should be evaluated. The cost-sensitive analysis framework can be adapted to Odin's budget allocation and infeasibility handling strategies. The SHAP-based explainability approach offers a method for interpreting Odin's predictions, building user trust and aiding in debugging. The noise robustness testing provides guidance on metric selection for real-world deployment where data quality varies."
  directly_justifies:
    - "F1-score is the most stable and balanced evaluation metric for imbalanced classification tasks."
    - "MCC provides a complementary and balanced evaluation but is less reliable than F1-score."
    - "Statistical tests like ANOVA and McNemar should be used to validate metric differences."
    - "Classification thresholds must be tuned carefully for each metric and business goal."
    - "Cost-sensitive evaluation aligns metric choice with financial decision-making priorities."
  limits:
    - "The study did not incorporate deep learning architectures, which may perform differently on imbalanced data."
    - "The cost-sensitive analysis used fixed penalties and did not explore adaptive cost matrices."
    - "Only structured tabular datasets were analyzed; results may not generalize to unstructured data."
    - "The alternative metrics (AUC, G-Mean, Balanced Accuracy, IBA) were not subjected to full statistical validation."
  mapping_rationale: "A systematic scan of all 12 functional domains and their associated topic codes was performed. The paper was flagged as highly relevant for System Evaluation (12.A, 12.B, 12.C) because it provides a comprehensive statistical framework for selecting metrics and evaluating algorithms. It was also flagged for Behavioral Profiling (5.A, 5.B) as it deals with classification of behavioral outcomes like default and churn, though it does not address profile dynamics directly. The cost-sensitive evaluation section provided contextual relevance to Budget Recommendation (7.D) regarding infeasibility handling. The review of existing practices and limitations provided medium relevance to Existing Systems & Gaps (4.A, 4.B). Domains like Filipino Cultural Context (2.A, 2.B, 2.C, 2.D), Expense Categorization (3.A, 3.B, 3.C), Mobile-First Design (9.A, 9.B), Data Privacy (10.A, 10.B), Retention (11.A, 11.B), and Savings & Debt Management (13.A, 13.B, 13.C) were rejected as the paper does not address these topics. Borderline cases included the potential application to Anomaly Detection (8.A, 8.B, 8.C), but the paper focuses on general classification rather than anomaly detection specifically, so it was not selected. Overall, the paper is highly relevant to Odin's evaluation and model assessment needs, providing actionable guidance on metric selection and statistical validation."
limitations:
  - "Only structured tabular datasets were used; findings may not generalize to unstructured financial data."
  - "Deep learning architectures were not evaluated; their performance and explainability patterns may differ."
  - "Cost-sensitive analysis used fixed penalties and did not adapt to dynamic business contexts."
  - "Alternative metrics like AUC and G-Mean were not subjected to the same statistical rigor as F1 and MCC."
  - "The study did not incorporate real-time decision thresholds or risk-based optimization constraints."
remember_this:
  - "F1-score is the most reliable single metric for imbalanced business classification."
  - "MCC offers complementary insight but F1-score is more stable across thresholds."
  - "Accuracy is misleading under class imbalance; it favors majority class predictions."
  - "SHAP analysis reveals feature importance varies significantly with metric choice."
  - "XGBoost combined with F1-score is robust for both credit default and churn prediction."
