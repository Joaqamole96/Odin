definitions:
  - term: PR AUC
    definition: Precision-Recall Area Under the Curve, a metric for imbalanced classification focusing on minority class performance.
  - term: Edge Computing
    definition: Processing data near the source (e.g., payment terminals) to reduce latency and bandwidth use.
  - term: Hybrid Optimization
    definition: Combining different models (e.g., deep learning and regression) to balance accuracy and efficiency.
  - term: Latency-Aware Routing
    definition: Dynamically selecting a model path based on current compute load and time constraints.
