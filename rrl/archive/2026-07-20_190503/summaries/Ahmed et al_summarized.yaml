  contribution: This paper provides a deployable blueprint for a hybrid fraud detection system at the edge, which is directly applicable to Odin's anomaly detection module (8.B) and predictive modeling module (6.B). Its latency-aware routing framework offers a strategy for Odin to balance computational cost and accuracy, a key consideration for mobile-first design (9.A). The emphasis on interpretability through a regression component supports Odin's need for transparent and trustworthy decisions (10.B). Furthermore, the evaluation methodology provides a template for assessing Odin's system performance (12.A).
  directly_justifies:
    - Hybrid routing can significantly reduce inference latency on edge devices.
    - Relying solely on lightweight regression or deep learning forces a trade-off between speed and accuracy.
    - A confidence-based routing controller can maintain low latency while preserving fraud detection recall.
    - Adaptive models are necessary to handle concept drift in financial transaction data.
    - Model quantization enables deep learning deployment on resource-constrained edge hardware.
  limits:
    - Results based on a single European credit card dataset may not generalize to U.S. transaction patterns and fraud tactics.
    - Hardware testing was simulated and does not fully capture the constraints of real point-of-sale systems.
    - The architecture assumes clean, trustworthy incoming data, which may be vulnerable to adversarial poisoning. [unacknowledged]
    - The system requires ongoing tuning of thresholds and retraining cycles, which demands mature model governance.
  mapping_rationale: A systematic scan of all 12 functional domains and their associated topic codes was performed. The paper was flagged as highly relevant to predictive modeling (6.A, 6.B) and anomaly detection (8.A, 8.B) because its core contribution is an algorithmic framework for real-time fraud detection on sequential spending data. It also holds medium relevance to mobile-first design (9.A) due to its focus on edge devices, and to data privacy and user trust (10.A, 10.B) through its emphasis on local processing and interpretability. The paper touches on behavioral classification (5.C) and evaluation frameworks (12.A, 12.B) at a medium level. Domains like Filipino cultural context (2.A-D), expense categorization (3.A-C), and savings/debt management (13.A-C) were rejected as the paper does not address them. The paper's primary contribution lies in its latency-aware hybrid optimization for financial risk, which directly informs Odin's design for efficient and trustworthy anomaly detection.
limitations:
  - Results based on a single European credit card dataset may not generalize to U.S. transaction patterns.
  - Hardware testing was simulated and does not fully capture real-world edge device constraints.
  - The system requires ongoing tuning and mature model governance to handle concept drift.
  - The architecture assumes clean, trustworthy incoming data, a vulnerability not fully addressed. [unacknowledged]
remember_this:
  - Hybrid routing reduced inference latency by up to 55 percent.
  - Deep learning alone exceeds latency budgets on edge hardware.
  - Confidence-based routing reserves deep analysis for ambiguous transactions.
  - Model quantization enables deep learning on resource-constrained devices.
  - Fast, explainable decisions are critical for user trust and regulatory compliance.
