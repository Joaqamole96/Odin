tldr: Hybrid routing with adaptive regression and selectively engaged deep learning reduces inference latency by up to 55% while preserving high fraud recall for edge-based financial risk assessment.
problem_and_motivation: Financial institutions need real-time fraud detection but face a trade-off: deep learning offers high accuracy but exceeds latency budgets on edge hardware, while lightweight regression is fast but misses nonlinear fraud patterns. This gap threatens operational compliance, fraud resilience, and customer experience in distributed payment infrastructures.
approach:
  - A streaming credit card fraud dataset with PCA-transformed features, amount, and time is used to simulate U.S. payment workloads.
  - The system comprises a deep neural network for complex pattern recognition and an adaptive regression model (Passive Aggressive or SGD) for fast decisions.
  - A hybrid optimization controller routes each transaction based on latency estimates and the regression model's confidence score.
  - The system is evaluated under simulated edge CPU and memory constraints using batch replay, with metrics including PR AUC, recall, and latency.
  - Baselines include standalone deep learning, standalone regression, and hybrid variants (cascade, gating, weighted ensemble).
findings:
  - num: Hybrid routing reduces inference latency by up to 55% compared to deep learning alone.
  - num: The quantized student model occupies 8253 bytes and achieves 0.347 ms latency, fitting within edge storage limits.
  - num: Fast regression model averages 0.31 ms latency in the edge_tiny setting, while deep learning ranges from 0.50 ms to 4.56 ms.
  - num: Median overall latency for hybrid strategies (e.g., cascade: 0.501 ms) stays close to the fast model (0.433 ms) during low-fraud periods.
  - The deep model shows better calibration, aligning risk scores more closely with actual fraud outcomes compared to regression.
  - Adaptive routing conserves compute by sending clear legitimate transactions through a fast linear path and ambiguous ones to deeper neural review.
  - PR AUC for deep learning was 0.0009 and for regression 0.0008, but threshold adjustment in the fast model raised recall into the 0.00 to 0.10 range.
  - Hybrid designs increase recall without slowing the entire system by routing uncertain predictions to the deeper model.
  - Pareto analysis shows a workable middle ground where the system delivers solid fraud coverage without exceeding acceptable latency.
key_figures_tables:
  - Figure 1: Class distribution and transaction amount by class → Fraud is rare and amount shows partial discriminative value.
  - Figure 2: Fraud rate by hour of day and day of the week → Slight temporal peaks suggest opportunistic timing by attackers.
  - Figure 3: Concept drift and correlation analysis → Fraud behavior evolves gradually; features provide orthogonal signals.
  - Figure 4: Rolling fraud incidence analysis → Near flat fraud distribution requires models to detect anomalies in a stable background.
  - Figure 5: Predictive Performance metrics → PR AUC and calibration highlight the challenge of rare fraud and the benefit of hybrid routing.
  - Figure 6: Latency and Resource Efficiency metrics → Quantization and hybrid routing keep memory and latency within edge budgets.
  - Figure 7: Trade-Off Analysis metrics → Pareto curves show the accuracy-latency frontier and the benefit of intelligent routing.
  - Figure 8: Robustness Checks metrics → Hybrid systems adapt under stress; static models fail with concept drift and latency spikes.
