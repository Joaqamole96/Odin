title: Unraveling the Investment Puzzle: Do Behavioral Biases and Financial Literacy Matter?
authors: Patiu, L. S.; Ang, L. K. C.; Masanque, J. A. A.; Nacario, J. M. C.; Paguntalan, R. M. M.
year: 2025
