  contribution: This paper provides empirical evidence that transparency and comprehensibility are critical for user trust and adoption in automated financial advisory systems. For Odin, the findings directly inform the design of transparent expense categorization (3.A) and budget recommendation interfaces (7.B) to reduce user uncertainty. The study's user-centered evaluation approach (12.A) validates the use of qualitative methods for assessing PFMS user experience. The observed demand for interactive data visualization (9.B) suggests that Odin should incorporate visual aids to enhance financial literacy and decision support. Additionally, the paper's emphasis on user trust (10.B) underscores the need for Odin to prioritize clear explanations and user control.
  directly_justifies:
    - Non-transparency in automated financial systems reduces user trust and adoption.
    - Interactive data visualization improves user comprehension of financial risk and performance.
    - Non-expert users require additional guidance and domain knowledge to understand system outputs.
    - Users expect personalized questions and holistic understanding rather than standardized profiling.
    - Automated systems lacking human-like interaction may fail to meet user expectations for advice.
  limits:
    - The study focuses on investment advice, which differs from the budgeting and expense management scope of Odin.
    - Participants were Swedish, and the RA was from a Scandinavian bank, limiting cultural generalizability to Filipino users.
    - The small sample size (24) and qualitative nature limit statistical generalizability.
  mapping_rationale: A systematic scan of all 12 functional domains and their associated topic codes was performed. The domains of 'Existing Systems & Gaps' (4.A, 4.B) and 'Mobile-First Design' (9.A, 9.B) were flagged as highly relevant, as the paper directly examines a real-world RA and its mobile UX. 'Data Privacy & User Trust' (10.B) was also high, given the centrality of trust. 'User Retention & Engagement' (11.A) and 'System Evaluation' (12.A) were medium, as the study touches on adoption willingness and uses a qualitative evaluation framework. The 'Behavioral Profiling & Classification' domain (5.A, 5.B, 5.C) was considered but rejected because the paper does not focus on classification algorithms or profile dynamics; it only uses risk assessment as a context. The 'Spending Forecasting' (6.A, 6.B) and 'Budget Recommendation' (7.A-D) domains were rejected because the paper addresses investment, not spending or budget allocation. 'Anomaly Detection' (8.A-C) was irrelevant. 'Savings & Debt Management' (13.A-C) was also not applicable. Overall, the paper is highly relevant to Odin's design considerations for transparency, trust, and UX, though its investment focus limits direct applicability to budgeting.
limitations:
  - Financial literacy was self-reported, not measured with a standardized test.
  - The study did not track long-term adoption or retention, only behavioral intention. [unacknowledged]
  - The RA was from a single bank, limiting generalizability to other systems.
  - Participants used a test account, which may have reduced the realism of high-stake decisions. [unacknowledged]
  - The study did not compare different levels of anthropomorphism or explainability features systematically. [unacknowledged]
remember_this:
  - Non-transparency in automated financial advice significantly undermines user trust.
  - Interactive data visualization enhances user understanding of risk and performance.
  - Only 4 of 24 participants trusted the RA's suggested investment amount.
  - Non-expert users need clearer explanations and domain knowledge support.
  - Users expect a more holistic and personalized advisory experience beyond standardized questions.
