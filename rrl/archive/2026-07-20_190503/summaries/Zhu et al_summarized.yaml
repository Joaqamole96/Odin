
paper_id: 10.1016/j.dim.2023.100041
designation: international
title: Not transparent and incomprehensible: A qualitative user study of an AI-empowered financial advisory system
authors: Zhu, H.; Sallnäs Pysander, E.-L.; Söderberg, I.-L.
year: 2023
venue: Data and Information Management
