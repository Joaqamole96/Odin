tldr: A qualitative user study of a retail bank robo-advisor reveals that non-transparency and incomprehensible information cause distrust and reduce adoption, while interactive data visualization shows promise.
problem_and_motivation: Few empirical studies investigate customer experience with fully functional robo-advisors in real-life scenarios. The relationship between automated system design and customer perception and adoption remains unknown. This gap is critical because financial decisions are high-stake and users are vulnerable.
approach:
  - 24 participants with diverse financial backgrounds used a retail bank robo-advisor on a mobile device.
  - Participants performed three tasks including investment scenario exploration and final recommendation review.
  - Data collection included pre-surveys, screen recordings, and retrospective post-test interviews.
  - Analysis used inductive coding of interview transcripts and video interaction logs.
  - The study compared expert and non-expert participants based on self-reported financial knowledge.
  - The RA system followed a standard flow: configuration, matching, and maintenance phases.
  - Google Translate assisted non-native language participants, verified by bilingual checks.
  - Pilot tests with 2 participants were excluded; final analysis included 24 participants.
  - The study focused on user perception and adoption, not system usability or algorithm performance.
findings:
  - num: Only 4 out of 24 participants input the exact investment amount suggested by the RA.
  - Participants perceived the RA as sales-centric rather than advisory, failing to see it as providing personalized financial advice.
  - Non-transparency in risk assessment and portfolio recommendation mechanisms led to distrust and low adoption willingness.
  - Incomprehensible information, especially for non-experts, hindered understanding and decision-making.
  - Interactive data visualization (risk color bars and performance line charts) was positively received and improved comprehension.
  - Participants expected more personalized questions and a holistic understanding of their financial situation.
  - Automated maintenance and rebalancing features were not perceived by participants until explained.
  - Participants who encountered contradictory inputs felt blamed and abandoned by the system.
  - Expert participants were more confident in using the RA, while non-experts required more guidance.
  - Most participants preferred human advisor involvement for calibration and to mitigate miscommunication risks.
