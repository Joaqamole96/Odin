tldr: Integrates federated learning with explainable AI via GradCAM and NormGrad to balance privacy and transparency in decentralized IoT environments.
problem_and_motivation: Standard AI models rely on centralized data, posing privacy risks and regulatory challenges, especially in sensitive domains like healthcare and IoT. Federated learning protects privacy but creates a "black box" where model decisions are opaque, limiting trust and adoption. The core challenge is balancing privacy preservation with the need for transparent, interpretable decision-making in decentralized systems.
approach:
  - Implements a convolutional neural network within a federated learning framework using the Flower library.
  - Evaluates FL strategies FedAvg, FedAdam, FedYogi, and FedOpt across balanced, random, and skewed data distributions.
  - Tests synchronous and asynchronous client synchronization modes.
  - Integrates visual interpretability techniques GradCAM and NormGrad at the client level to generate heatmaps without sharing raw data.
  - Analyzes the trade-off between privacy (via Gaussian noise injection) and model performance/interpretability.
  - Assesses the impact of client numbers, model complexity, and weight sharing effectiveness on accuracy and interpretability.
findings:
  - num: FedAvg and FedOpt achieved stable performance (~71% accuracy), while FedAdam and FedYogi showed higher sensitivity to data heterogeneity.
  - num: Synchronous FL achieved a higher final accuracy (0.74) compared to asynchronous FL (0.70), offering more stable client performance.
  - num: Adding Gaussian noise for privacy protection decreased model accuracy from high to low and degraded the clarity of GradCAM/NormGrad heatmaps, confirming a privacy-interpretability trade-off.
  - Multi-task federated learning produced more focused and precise heatmaps than standard FL, despite a slight drop in accuracy (69.7% vs. 70.7%).
  - num: Increasing the number of clients from 2 to 20 reduced overall accuracy (0.74 to 0.58) but improved the focus and visual precision of interpretability heatmaps.
key_figures_tables:
  - Figure 4.14: Accuracy comparison of FedAvg under Equal, Random, and Unequal data distribution → Equal distribution yields the highest and most stable accuracy.
  - Figure 4.21: Accuracy comparison of Sync vs. Async in FedAvg → Sync mode achieves higher final accuracy and more consistent client performance.
  - Figure 4.30: Accuracy during different privacy noise levels → Increasing noise progressively reduces model accuracy.
  - Table 4.5: Impact of privacy noise on model accuracy and visual explanations → Higher noise improves privacy scores but severely degrades interpretability quality.
  - Table 4.9: Impact of client number on model performance and heatmap interpretability → More clients improve heatmap focus but reduce overall accuracy.
key_equations:
  - equation: $L_{CrossEntropy} = -\sum_{i=1}^{C} y_i \log(\hat{y}_i)$
    explanation: Loss function for multi-class classification.
  - equation: $L_{GradCAM}^{c} = ReLU\left(\sum_{k} \alpha_k^c A^k\right)$
    explanation: Generates class-discriminative localization heatmap.
  - equation: $\hat{H}(x) = \frac{\|\nabla_x f_y(x)\| - \min(\|\nabla_x f_y(x)\|)}{\max(\|\nabla_x f_y(x)\|) - \min(\|\nabla_x f_y(x)\|) + \varepsilon}$
    explanation: Normalizes gradient saliency for local interpretability.
  - equation: $w_{t+1} = \sum_{k=1}^{K} \frac{n_k}{n} w_t^{(k)}$
    explanation: FedAvg weighted aggregation of client model weights.
definitions:
  - term: Federated Learning (FL)
    definition: Decentralized training where models learn locally on devices and only parameter updates are shared.
  - term: Explainable AI (XAI)
    definition: Set of techniques to make AI decision-making transparent and understandable to humans.
  - term: GradCAM
    definition: Gradient-weighted Class Activation Mapping, a technique to visualize important regions in an image for model prediction.
  - term: NormGrad
    definition: Normalized Gradient, a saliency method providing fine-grained, localized interpretations of input influence.
  - term: Differential Privacy
    definition: Technique adding calibrated noise to data or model updates to prevent inference of individual records.
  - term: FedAvg
    definition: Federated Averaging, a baseline FL algorithm that computes a weighted average of client model updates.
