  contribution: This thesis provides an end-to-end framework for privacy-preserving federated learning that integrates visual explainability, a critical need for Odin's predictive and anomaly detection modules. The rigorous comparison of FL strategies offers evidence-based guidance for selecting the appropriate aggregation algorithm to handle heterogeneous user spending data. The empirical analysis of the privacy-interpretability trade-off, including how noise affects both accuracy and explanation quality, directly informs the design decisions for Odin's differential privacy mechanisms. The scalability insights regarding the number of clients and communication overhead are vital for deploying Odin as a mobile-first PFMS with potentially many users.
  directly_justifies:
    - Federated learning can effectively train models on decentralized data while preserving user privacy.
    - The integration of visual explainability techniques enhances model transparency without requiring raw data access.
    - Synchronous aggregation yields more stable and accurate global models than asynchronous updates.
    - There exists a direct trade-off between privacy protection (via noise) and model performance/interpretability.
    - Multi-task learning can improve model interpretability at a minimal cost to predictive accuracy.
  limits:
    - Simulation uses CIFAR-10 image data, not financial transaction data, limiting direct generalizability.
    - Privacy score metric (1 - Accuracy) is simplistic and does not provide formal differential privacy guarantees. [unacknowledged]
    - The analysis of asynchronous FL is limited and does not fully explore the impact of client staleness.
    - The paper does not evaluate the computational overhead of GradCAM/NormGrad on resource-constrained mobile devices.
  mapping_rationale: A systematic scan across all 12 functional domains was performed. The paper's primary relevance lies in its exploration of privacy-preserving (Domain 10) and interpretable (Domain 8) AI, as it directly investigates the trade-off between data protection and model transparency, which are foundational for user trust and effective anomaly detection in a PFMS. Its algorithmic contributions and empirical evaluation (Domain 12) are highly relevant for selecting and benchmarking Odin's predictive modules. While the paper focuses on IoT and healthcare, its core FL-XAI framework and findings on data distributions and client scalability are applicable to the financial domain. Domains related to Filipino cultural context (2), expense categorization (3), behavioral profiling (5), and savings/debt management (13) were considered but rejected as the paper does not address these specific financial topics. The borderline case was between privacy (10.A/10.B) and algorithm evaluation (12.B/12.C), both deemed highly/medium relevant as the paper provides both a methodological framework and a performance benchmark.
limitations:
  - The study uses a generic image dataset (CIFAR-10) rather than domain-specific financial or medical data.
  - Privacy metric is a proxy, lacking formal guarantees from differential privacy or other rigorous frameworks. [unacknowledged]
  - Communication overhead and resource consumption (RAM/CPU) are measured but not thoroughly optimized for mobile or IoT devices.
  - The framework is not tested against malicious attacks (e.g., Byzantine or poisoning), a common concern in federated learning. [unacknowledged]
  - Interpretability analysis is qualitative; no quantitative metrics are used to assess explanation quality.
remember_this:
  - Federated learning balances privacy and performance through decentralized training.
  - Explainable AI is critical for building user trust in opaque models.
  - Synchronous aggregation yields more stable and accurate models than asynchronous.
  - Privacy noise degrades both model accuracy and the clarity of explanations.
  - num: Increasing clients from 2 to 20 reduced accuracy from 0.74 to 0.58.
