  contribution: The paper's audit-aligned evaluation protocol using Recall@Top-k directly justifies Odin's evaluation framework for predictive modules. The finding that missingness patterns carry predictive signal informs Odin's preprocessing design for spending data with incomplete entries. The comparison of cost-sensitive learning, resampling, and focal loss provides empirical guidance for selecting anomaly detection techniques in Odin's spending forecasting module. The cohort-level ratio portrait methodology offers a template for explainable risk summaries in Odin's user-facing reports.
  directly_justifies:
    - Audit-aligned Recall@Top-k is more actionable than threshold-based recall for constrained review budgets.
    - Missingness indicators should be treated as predictive signals rather than noise to be imputed away.
    - Tree ensembles outperform linear models for rare-event prediction on tabular financial data.
    - Cost-sensitive learning with class weights improves rare-event retrieval but interacts with model capacity.
  limits:
    - Results are based on Polish corporate data and may not generalize to personal spending patterns.
    - The fixed random split provides reproducibility but lacks uncertainty estimates from repeated validation.
    - Focal loss was only tested with linear models and fixed hyperparameters; tuning may alter conclusions.
  mapping_rationale: A systematic scan across all 12 functional domains and their associated topic codes identified that the paper's core contributions align with predictive modeling (6.A, 6.B), anomaly detection (8.A, 8.B), and system evaluation (12.A, 12.B). These were assigned high or medium relevance because the paper provides citeable claims about algorithmic comparison, rare-event detection, and evaluation metrics. The domains of Filipino cultural context (2.A-D), expense categorization (3.A-C), budget recommendation (7.A-D), mobile-first design (9.A-B), data privacy (10.A-B), user retention (11.A-B), and savings/debt management (13.A-C) were rejected as the paper neither addresses personal finance contexts nor Filipino-specific financial behaviors. The paper's techniques are transferable to personal finance anomaly detection, but its corporate bankruptcy framing means direct applicability is contextual rather than direct. Overall, the paper provides strong methodological guidance for Odin's predictive and evaluation modules while being less directly relevant to user-facing or culturally specific features.
limitations:
  - Results based on a single stratified split with fixed seed; repeated or time-based validation would provide additional robustness. [unacknowledged]
  - Dataset is Polish corporate firms and may not generalize to Filipino personal finance or other jurisdictions. [acknowledged]
  - Focal loss evaluated only in linear configuration with fixed hyperparameters; broader tuning may yield different conclusions. [acknowledged]
  - Cross-sectional data does not model within-firm temporal trajectories or macroeconomic indicators. [acknowledged]
remember_this:
  - Random forests with missingness indicators improved AUPRC by 0.16 in the most imbalanced case.
  - Auditing the top 5% of ranked firms recovered 63% of bankruptcies, versus 12% for logistic regression.
  - Missingness patterns are predictive and should be used as features rather than imputed away.
  - Evaluation should use Recall@Top-k to align with constrained review budgets.
  - Tree ensembles dominate linear models for rare-event prediction on tabular financial data.
