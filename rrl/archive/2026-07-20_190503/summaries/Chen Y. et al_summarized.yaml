  - 12.B
tldr: Evaluates cost-sensitive learning, resampling, and focal loss for bankruptcy prediction, finding that random forests with missingness indicators achieve superior ranking under audit budgets.
problem_and_motivation: Auditors face a going-concern screening problem where failing to identify a distressed firm is substantially costlier than issuing a false alarm. Standard classifiers optimized for overall accuracy are biased toward the majority class in rare-event settings. Existing methods lack audit-aligned evaluation that reflects constrained review capacity.
approach:
  - Used Polish Companies Bankruptcy dataset with five forecasting horizons, 64 ratios, and 43,405 firm-year records.
  - Compared three imbalance-aware strategy families: cost-sensitive learning via class-weighted objectives, resampling (ROS, RUS, SMOTE), and focal loss.
  - Employed logistic regression and random forests as base learners with fixed random seed for reproducibility.
  - Evaluated models using AUPRC and Recall@Top-k, where k represents the fraction of firms audited under a constrained sampling budget.
  - Augmented the best model with missingness indicator features to exploit predictive missingness patterns.
  - Constructed explainable financial-ratio portraits for high-risk cohorts using median scaled ratios.
findings:
  - num: Cost-sensitive RF+MI improved AUPRC from 0.480 to 0.640 in the 1stYear case.
  - num: At top 5% audit budget, RF+MI recovered 62.96% of bankruptcies versus 12.35% for logistic regression.
  - num: Adding missingness indicators increased AUPRC in every horizon, with the largest gain in 1stYear (0.480 to 0.640).
  - num: In 1stYear at k=1%, RF+MI achieved Precision@Top-1% of 0.909, corresponding to 23.6x lift over the base bankruptcy rate.
  - Tree ensembles consistently dominated linear models across all five forecasting horizons.
  - Missingness indicators, especially Missing(Attr27), were predictive and interpretable as reporting-structure cues.
  - Focal loss with linear model did not improve over standard logistic regression with fixed hyperparameters.
key_figures_tables:
  - Figure 3: Precision-recall curves for 1stYear → RF+MI dominates, maintaining high precision at low recall.
  - Figure 4: Audit cost curves for 1stYear → RF+MI reaches 50% recall at ~2.5% audit budget, LR never reaches 50%.
  - Figure 6: Financial-ratio portrait for high-risk cohort → flagged firms show higher leverage and weaker liquidity.
  - Table 5: AUPRC results across methods and horizons → RF+MI achieves best AUPRC in all cases.
  - Table 11: Missingness indicator importances → Missing(Attr27) is the most predictive missingness feature.
key_equations:
  - equation: FL(p_t) = -α(1-p_t)^γ log(p_t)
    explanation: Focal loss down-weights easy negatives to focus on hard examples.
  - equation: x_new = x_i + λ(x_nn - x_i), λ∈[0,1]
    explanation: SMOTE generates synthetic minority points by interpolating between neighbors.
definitions:
  - term: AUPRC
    definition: Area under the precision-recall curve, also known as average precision.
  - term: Recall@Top-k
    definition: Fraction of all positive instances found in the top k% of a ranked list.
  - term: ROS
    definition: Random over-sampling duplicates minority examples to balance class distribution.
  - term: RUS
    definition: Random under-sampling removes majority examples to balance class distribution.
  - term: SMOTE
    definition: Synthetic minority over-sampling technique that interpolates between minority neighbors.
critical_citations:
