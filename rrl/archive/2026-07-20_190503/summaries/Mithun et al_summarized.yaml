tldr: AI-driven credit scoring using alternative data improves loan default prediction and financial inclusion for underserved US small businesses.
problem_and_motivation: Traditional credit scoring systems exclude many small businesses with thin credit files. This limits their access to capital, stifling economic growth. There is a gap in creating robust and explainable AI models that leverage alternative data.
approach:
  - Quantitative exploratory design using a multidimensional lending dataset.
  - Employed machine learning including decision trees, logistic regression, and random forest.
  - Analyzed demographic, financial, and behavioral variables like education, marital status, and income.
  - Data preprocessing included missing value treatment, categorical encoding, and normalization.
  - Model performance was evaluated using accuracy, precision, recall, and F1-score.
findings:
  - num: Unemployed borrowers had the highest average default rate at 0.14.
  - num: Full-time employees had the lowest average default rate at over 0.10.
  - Higher education levels correlate with lower default rates.
  - Married and divorced borrowers show slightly higher mean credit scores than singles.
  - The presence of a co-signer is associated with lower default rates across all loan types.
key_figures_tables:
  - Figure 1: Average default rate per employment type → Full-time workers have the lowest default risk.
  - Figure 2: Mean credit score by marital status → Divorced individuals have the highest average score.
  - Figure 3: Average income distribution by income bin → Data shows a linear and even income progression.
  - Figure 4: Average loan amount and defaults by loan purpose → Business and auto loans have higher default rates.
  - Figure 8: Defaults by loan purpose and co-signer status → Co-signers reduce default risk for all loan purposes.
