  contribution: This paper provides a robust methodology for using alternative data and machine learning to predict credit risk, which can be adapted for Odin's user profiling and forecasting modules. Its findings on the predictive power of demographic and behavioral variables directly inform the classification of user financial profiles. The emphasis on explainable AI and fairness provides a foundational framework for building user trust in Odin's recommendations and anomaly alerts.
  directly_justifies:
    - Alternative data like utility payments and employment history can predict creditworthiness.
    - Machine learning models offer higher accuracy and better risk segmentation than traditional methods.
    - Behavioral factors such as education and marital status are predictive of financial reliability.
  limits:
    - The dataset used is historical and static, not updated in real-time.
    - Macro-economic variables like unemployment rates or inflation were not included. [unacknowledged]
    - Findings are based on US data and may not be directly generalizable to the Philippines.
  mapping_rationale: A systematic scan across all 12 functional domains and associated topic codes was conducted. The paper was flagged as highly relevant for Predictive Modeling (6.A, 6.B) and Anomaly Detection (8.A, 8.B) as its core contribution is algorithmic default prediction. It was also highly relevant to Behavioral Profiling (5.A, 5.B, 5.C) and Limitations of Existing Systems (4.B) due to its critique of FICO and use of alternative data. It provides medium relevance to Data Privacy (10.A) and User Trust (10.B) through its discussion of responsible AI and explainability. The paper was considered but rejected for high relevance to topics under Savings & Debt Management (13.A, 13.B) or Budget Recommendation (7.A-D) as these are not central themes, though debt (13.B) is contextually relevant. The overall relevance is strong as it provides evidence and techniques for building an inclusive, fair, and predictive user assessment system for a PFMS.
limitations:
  - The study does not address real-time credit scoring or dynamic model updating.
  - It lacks a detailed discussion on bias detection and mitigation in the proposed models.
  - Data was sourced from a public lending dataset, and its representativeness of the broader population is unclear. [unacknowledged]
remember_this:
  - Alternative data significantly improves credit scoring accuracy for underserved groups.
  - Employment type is a strong predictor of default, with full-time workers being safest.
  - Co-signers reduce default risk, especially for business and auto loans.
  - num: Unemployed borrowers have the highest default rate at 14 percent.
  - Explainable AI is crucial for building trust and ensuring regulatory compliance.
