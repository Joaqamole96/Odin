definitions:
  - term: Artificial Intelligence (AI)
    definition: The science of developing intelligent systems capable of human-like thinking, learning, problem-solving, and decision-making.
  - term: Machine Learning (ML)
    definition: A subset of AI using algorithms and statistical models that allow systems to improve performance through experience.
  - term: Big Data Analytics
    definition: The process of analyzing datasets characterized by large volume, high velocity, wide variety, and veracity to extract value.
  - term: Internet of Things (IoT)
    definition: Networks of physical objects embedded with sensors and communication capabilities to collect and exchange data.
  - term: Blockchain
    definition: A distributed ledger technology providing security, transparency, and immutability through cryptographic methods.
  - term: PRISMA
    definition: Preferred Reporting Items for Systematic Reviews and Meta-Analyses, a framework for rigorous systematic literature reviews.
  - term: Edge Computing
    definition: Processing data closer to its source to reduce latency, bandwidth usage, and enable offline operation.
  - term: Federated Learning
    definition: A privacy-preserving technique that trains global models on distributed datasets without centralizing raw data.
  - term: AutoML
    definition: Automated machine learning that democratizes model development by automating selection, hyperparameter optimization, and feature engineering.
  - term: MLOps
    definition: DevOps practices adapted for machine learning model development, deployment, and monitoring.
