  - 5.A
  - 8.A
tldr: Hybrid deep neural network integrating structured financial data with unstructured text from customer logs, news, and social media achieves superior credit risk prediction accuracy.
problem_and_motivation: Traditional credit scoring models rely on structured data and fail to assess borrowers with limited credit histories. The increasing availability of unstructured data offers new opportunities to enhance risk assessment. Deep learning can model high-dimensional and unstructured data to provide more comprehensive borrower evaluations.
approach:
  - Combined Lending Club and Kaggle structured data with unstructured customer interaction logs, financial news, and Twitter sentiment data.
  - Preprocessed structured data with imputation and normalization, and text with cleaning, lemmatization, and GloVe embeddings.
  - Developed a hybrid DNN with a feedforward branch for structured data and a Bi-LSTM branch for unstructured text, fused via dense layers.
  - Trained the model using binary cross-entropy and Adam optimizer with early stopping.
  - Evaluated using stratified 5-fold cross-validation and benchmarked against logistic regression, random forest, XGBoost, and single-modality DNNs.
findings:
  - "num: The hybrid DNN achieved an accuracy of 87% and an AUC-ROC of 0.91."
  - "num: XGBoost performed best among traditional models with 85% accuracy and 0.89 AUC-ROC."
  - "num: The Bi-LSTM text-only model achieved 83% accuracy and 0.88 AUC-ROC, confirming textual signals contain predictive insights."
  - SHAP analysis identified credit utilization and sentiment-laden text as key predictors.
  - The hybrid model demonstrated superior recall (85%) in identifying high-risk borrowers.
