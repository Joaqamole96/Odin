    - "Unstructured text from customer interactions and social media contains predictive signals for financial behavior."
    - "Multimodal fusion of structured and unstructured data improves recall in identifying high-risk individuals."
    - "A Bi-LSTM architecture effectively processes financial text for risk classification."
