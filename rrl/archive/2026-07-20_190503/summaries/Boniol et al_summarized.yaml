key_equations:
  - equation: $A_k(T_{i,\ell}) = \min_{J \subset I, |J|=k+1} \sum_{j \in J} d(T_{i,\ell}, T_{j,\ell})$
    explanation: Anomaly score for subsequence as distance to its kth nearest neighbor.
  - equation: $LOF_k(A) = \frac{\sum_{B \in N_k(A)} lrd_k(B)}{|N_k(A)| \cdot lrd_k(A)}$
    explanation: Local outlier factor measures isolation based on local reachability density.
  - equation: $\min_{\omega \in F, \xi \in R, \rho \in R} \frac{1}{2}||\omega||^2 + \frac{1}{\nu \ell} \sum_i \xi_i - \rho$
    explanation: One-class SVM formulation for separating normal instances from the origin.
definitions:
  - term: Time Series
    definition: An ordered sequence of real-valued data points.
  - term: Anomaly
    definition: A data point or group of data points that do not conform to a notion of normality.
  - term: Point Anomaly
    definition: A single data point that deviates remarkably from the rest of the data.
  - term: Contextual Anomaly
    definition: A data point within the expected range but deviating from the expected local context.
  - term: Collective Anomaly
    definition: A sequence of points that do not repeat a typical pattern.
  - term: Matrix Profile
    definition: A meta time series where each element contains the distance of a subsequence to its nearest neighbor.
  - term: AUC-ROC
    definition: Area under the receiver operating characteristic curve, a threshold-independent evaluation measure.
