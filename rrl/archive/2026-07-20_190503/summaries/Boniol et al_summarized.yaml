  contribution: "This survey directly contributes to Odin's design by offering a structured overview of anomaly detection methods, which is crucial for its `Anomaly Detection Module`. It provides a basis for selecting and implementing a suitable algorithm for identifying irregular spending patterns in user transactions. The detailed analysis of evaluation measures, particularly the critique of point-adjusted metrics and the introduction of VUS, provides the foundation for a robust evaluation framework for Odin's algorithmic modules. Its discussion on the lack of a one-size-fits-all detector supports a design decision to implement multiple methods or a model selection mechanism within Odin."
  directly_justifies:
    - "Time-series anomaly detection methods should be evaluated using threshold-independent measures like VUS-ROC to avoid biases."
    - "No single anomaly detection method is superior for all datasets, suggesting Odin should implement a model selection or ensemble approach."
    - "LSTM and autoencoder-based methods are currently the most popular for time-series anomaly detection and are prime candidates for Odin's core detection engine."
  limits:
    - "The survey focuses on anomaly detection and does not cover other aspects of a PFMS like budget recommendation or expense categorization."
    - "While it reviews many algorithms, it does not provide a practical guide for implementing them in a mobile-first, privacy-conscious application like Odin."
  mapping_rationale: "A systematic scan of all 12 functional domains was performed. The paper is most centrally relevant to the `Anomaly Detection` domain, with high relevance to topics 8.A (detection), 8.B (algorithms), and 8.C (cold-start baselines). Its extensive review of forecasting methods (6.A, 6.B) is also highly relevant for the `Spending Forecasting` module. The in-depth discussion on evaluation (12.A, 12.B, 12.C) provides crucial guidance for Odin's `System Evaluation`. Topics related to financial profiling (5.A, 5.B, 5.C), cultural context (2.A, 2.B, 2.C, 2.D), and savings/debt (13.A, 13.B, 13.C) were considered but rejected as the paper does not address these domains. Borderline cases, such as the paper's discussion of user behavior and system engagement, are mentioned only in passing and thus assigned low relevance for topics 1.C and 11.A. Overall, this paper provides a foundational understanding of the technical core of Odin's anomaly detection and forecasting capabilities, directly informing algorithm selection and evaluation strategies."
limitations:
  - "The paper is a survey and does not introduce a novel algorithm specifically for personal finance or user-spending data. [unacknowledged]"
  - "The evaluation of algorithms discussed is based on general time-series benchmarks, which may not fully represent the nuances of individual user spending data. [unacknowledged]"
  - "The review of multivariate methods is less comprehensive than for univariate methods, limiting its direct applicability to Odin's multi-feature analysis."
