tldr: A comprehensive survey categorizes time-series anomaly detection methods into distance-based, density-based, and prediction-based approaches, providing a process-centric taxonomy and a meta-analysis of research trends.
problem_and_motivation: Research on time-series anomaly detection is fragmented across communities, using different datasets, baselines, and evaluation measures, making it difficult to identify the best approach for a given use case. A unified, comprehensive taxonomy and survey of existing methods are needed to organize the field and guide practitioners.
approach:
  - The survey defines a process-centric taxonomy with three top-level categories: distance-based, density-based, and prediction-based methods.
  - Each top-level category is further divided into process-centric subcategories, such as proximity-based, clustering-based, and discord-based for distance-based methods.
  - The paper provides a detailed description of state-of-the-art algorithms within each subcategory, including both traditional statistical and modern deep learning approaches.
  - A meta-analysis is conducted to show the evolution of the field over time, analyzing trends in the types of methods, data dimensions, and supervision levels.
  - The survey also discusses existing benchmarks and evaluation measures, highlighting their limitations and proposing newer, more appropriate metrics like Range-AUC and VUS.
findings:
  - num: The number of proposed methods increased significantly after 2016, driven primarily by prediction-based approaches like LSTM and autoencoders, which now represent almost 50% of new methods.
  - num: 65% of anomaly detection methods proposed between 1980 and 2000 were unsupervised, while only 50% of methods proposed between 2012 and 2018 were unsupervised.
  - num: Existing benchmarks often contain flawed datasets with issues like triviality, unrealistic anomaly density, and mislabeled ground truth, which can create an illusion of progress.
  - The survey concludes that no single best anomaly detection method exists for all time-series datasets, and recent evaluations suggest that model selection and ensembling are promising research directions.
  - The new Range-AUC and Volume Under the Surface (VUS) measures are proposed to more accurately evaluate subsequence anomalies by accounting for the temporal and sequential nature of the data.
key_figures_tables:
