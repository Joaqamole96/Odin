tldr: Dynamic customer segmentation using time series clustering and genetic algorithm-based feature weighting improves accuracy over static RFM methods.
problem_and_motivation: Traditional customer segmentation methods treat RFM features independently and fail to capture the dynamic, temporal nature of customer interactions. This limits their ability to adapt to evolving behaviors and market conditions, and they often neglect customer lifecycle costs. There is a need for a dynamic, feature-optimized segmentation approach that accounts for temporal patterns and cost.
approach:
  - Data from a banking payment service company with 195,844,085 transactions over 30 months for 48,948 customers.
  - Customer behavior represented as multivariate time series of recency, frequency, monetary profit, and customer cost (RFMC).
  - Features are weighted using a genetic algorithm to optimize clustering relevance.
  - Spectral clustering is applied to the optimized feature set.
  - Evaluation uses Silhouette and Calinski-Harabasz indices, with Dunn index for optimal cluster count selection.
  - Results are compared against K-means, hierarchical, and fuzzy C-means clustering without optimization.
findings:
  - num: The spectral clustering algorithm with genetic algorithm-optimized weights achieved a Silhouette score of 0.91.
  - num: The Calinski-Harabasz index for the optimized spectral model was 17307, compared to 7596 without optimization.
  - num: The genetic algorithm found optimal weights of -0.70 for transaction frequency, 0.80 for profit, and 0.90 for cost, with an objective function value of 0.91.
  - num: The study processed 195,844,085 transactions from 48,948 customers.
  - Dynamic segmentation using time series clustering captures behavioral changes over the customer lifetime.
  - Including customer cost as a feature improves segmentation and enables cost management strategies.
  - The proposed model outperformed prior studies, with significant improvements in clustering accuracy.
key_figures_tables:
  - Figure 4-7: Genetic algorithm fitness function convergence for K-means, spectral, fuzzy C-means, and hierarchical → Spectral algorithm achieved highest accuracy.
  - Figure 8: Bar chart comparing genetic algorithm with different fitness functions → Spectral algorithm provided best segmentation accuracy.
  - Figure 10-13: Silhouette and Calinski-Harabasz index comparisons before and after genetic algorithm optimization → All algorithms improved, spectral most significantly.
  - Figure 14: Line chart of average feature values per cluster over 30 months → Cluster 3 shows stable high value; Cluster 2 shows declining behavior.
  - Figure 18: Average feature values per cluster → Cluster 3 (Gold) has highest transaction frequency and profit; Cluster 2 (Bronze) has lowest cost.
key_equations:
  - equation: MinMax\ normalization = (X - X_min) / (X_max - X_min)
    explanation: Normalizes feature values to range between 0 and 1.
  - equation: Silhouette(i) = (b(i) - a(i)) / max(a(i), b(i))
    explanation: Measures cluster separation and cohesion, ranges from -1 to 1.
  - equation: Calinski-Harabasz = (B / (k - 1)) / (W / (N - k))
    explanation: Evaluates cluster quality based on between-cluster and within-cluster variance.
definitions:
  - term: RFMC
    definition: Recency, Frequency, Monetary profit, and Customer Cost time series features.
  - term: Genetic Algorithm
    definition: Evolutionary optimization method used to find optimal feature weights for clustering.
  - term: Spectral Clustering
    definition: Clustering method based on spectral analysis of graph structure from data.
  - term: Silhouette Index
    definition: Internal clustering validity measure assessing separation and cohesion of clusters.
  - term: Calinski-Harabasz Index
    definition: Clustering validity index measuring between-cluster dispersion relative to within-cluster dispersion.
