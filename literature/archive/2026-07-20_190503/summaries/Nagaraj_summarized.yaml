tldr: A hybrid LSTM and logistic regression model improves credit default prediction by combining temporal behavioral patterns with static financial indicators.
problem_and_motivation: Econometric credit risk models are interpretable but lack predictive power, while deep learning models offer accuracy but are opaque. A model is needed that balances both to meet regulatory and operational demands in finance.
approach:
  - Used UCI Credit Card Default dataset (30,000 instances) and a proprietary dataset (45,000 records with 6-month behavioral sequences).
  - Proposed hybrid architecture with an LSTM branch for time-series behavioral data and a logistic regression branch for static econometric features.
  - Concatenated outputs from both branches and passed through a sigmoid layer for final default probability.
  - Applied k-NN imputation, winsorization, target encoding, and Min-Max scaling for preprocessing.
  - Used SMOTE on training data to address class imbalance and applied 5-fold cross-validation for evaluation.
findings:
  - num: Hybrid model achieved an AUC-ROC of 0.91, compared to 0.85 for LSTM-only and 0.81 for logistic regression.
  - num: F1-score for the hybrid model was 0.80, outperforming LSTM-only (0.74) and logistic regression (0.69).
  - num: Hybrid model attained 85% recall with only 15% false positive rate, outperforming standalone models.
  - The hybrid model exhibited near-perfect calibration, while LSTM showed overconfidence and logistic regression underestimated risk.
  - SHAP analysis identified debt-to-income ratio, past delinquency, credit utilization, income level, and age as most predictive features.
key_figures_tables:
  - Table 1: Dataset Overview → Describes UCI and proprietary datasets with sizes and features.
  - Table 2: Model Performance Comparison → Hybrid model outperforms logistic regression and LSTM-only in all metrics.
  - Figure 2: ROC Curves for All Models → Hybrid model curve dominates, with highest AUC-ROC of 0.91.
  - Figure 3: SHAP Summary Plot for Econometric Features → Shows DTI and past delinquency as top predictors of default.
key_equations:
  - equation: "P(default) = σ(W_final · [h_LSTM, h_LR] + b_final)"
    explanation: Concatenated LSTM and logistic regression outputs produce final default probability.
  - equation: "SHAP_i = Σ_{S⊆F\{i}} (|S|!(|F|-|S|-1)!)/(|F|!) [f(S∪{i}) - f(S)]"
    explanation: SHAP values quantify each feature's marginal contribution to predictions.
definitions:
  - term: LSTM
    definition: Long Short-Term Memory network for learning sequential patterns in time-series data.
  - term: AUC-ROC
    definition: Area Under the Receiver Operating Characteristic curve measuring model ranking ability.
  - term: SHAP
    definition: SHapley Additive exPlanations for interpreting machine learning model predictions.
  - term: SMOTE
    definition: Synthetic Minority Over-sampling Technique for addressing class imbalance.
