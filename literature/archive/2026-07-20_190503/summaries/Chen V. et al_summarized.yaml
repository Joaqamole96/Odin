  - 2.C
  - 3.C
tldr: A mixed-methods study reveals three types of human intuition that drive non-reliance on AI, explaining why feature-based explanations increase overreliance while example-based explanations improve decision-making.
problem_and_motivation: AI explanations are intended to improve human-AI decision-making, but empirical studies show they often increase overreliance on incorrect AI predictions. A critical gap in understanding is how decision-makers integrate their own intuition with AI predictions and explanations during the decision-making process.
approach:
  - A think-aloud, mixed-methods study was conducted with 26 participants.
  - Participants performed two prediction tasks (income and biography classification) under three conditions: no AI, AI support with feature-based explanations, and AI support with example-based explanations.
  - Feature-based explanations used LIME to show feature contributions, while example-based explanations displayed the two nearest training examples with their AI predictions and ground-truth labels.
  - The study measured decision accuracy and used qualitative analysis of think-aloud and interview data to investigate the decision-making process.
findings:
  - num: Feature-based explanations did not improve accuracy over no AI and increased overreliance on incorrect AI predictions.
  - num: Example-based explanations led to complementary human-AI performance, achieving 71.1% accuracy versus 60.6% for feature-based and 61.1% for no AI in the income task.
  - Three intuition-driven pathways to override AI predictions were identified: strong outcome intuition, intuition about features to discredit explanations, and intuition about AI limitations via unreliability signals.
  - num: Example-based explanations provided stronger signals of prediction unreliability, such as when the AI was wrong on both similar examples, which was highly correlated with AI incorrectness.
  - num: Participants with the lowest domain knowledge (43.8% accuracy) improved significantly with example-based explanations (70.0%) but not with feature-based (52.5%).
key_figures_tables:
  - Figure 2: Participant accuracy across conditions → Example-based explanations achieve complementary performance, outperforming human and AI alone.
  - Table 1: Accuracy breakdown by scenario (AI/P2 correctness) and explanation type → Example-based explanations outperform feature-based in most scenarios, especially when AI is wrong.
  - Figure 3: Examples of explanations signaling unreliability → LowDiff feature-based and BothWrong example-based explanations indicate prediction unreliability.
