  contribution: This paper provides a fundamental understanding of how human intuition shapes reliance on AI in decision-making, identifying three specific pathways users follow to override AI predictions. These pathways offer a framework for designing AI systems that better accommodate user intuition, such as adaptive explanations or personalized support. The work directly justifies the need for example-based explanations over feature-based ones in systems like Odin, particularly for supporting users with varying domain knowledge. It also highlights the risk of overreliance when using feature-based explanations, a critical design consideration for a PFMS where user trust and correct financial decisions are paramount. The findings can inform the development of Odin's explanation module and user interface to encourage appropriate reliance.
  directly_justifies:
    - "Example-based explanations are less disruptive of natural intuition and can improve decision-making in AI-assisted tasks."
    - "Feature-based explanations can increase overreliance on incorrect AI predictions, a pitfall for any AI-assisted decision system."
    - "Signals of prediction unreliability, such as incorrect predictions on similar examples, help users form intuition about AI limitations."
    - "Users with low domain knowledge benefit more from example-based explanations than from feature-based ones."
  limits:
    - "The study was conducted with a convenience sample of highly educated and ML-experienced individuals, limiting generalizability."
    - "The two tasks (income prediction and biography classification) are low-stakes and may not represent high-stakes financial decision-making."
    - "The think-aloud protocol may have encouraged more cognitive engagement than in a realistic setting."
  mapping_rationale: A systematic scan of all 12 functional domains was performed. The paper was flagged as highly relevant to Behavioral Profiling & Classification (5.A, 5.B) because it directly examines how users' pre-existing intuition and knowledge influence their interaction with and reliance on AI, which is a core aspect of profiling user behavior. It was also relevant to System Evaluation (12.A) for its mixed-methods framework. The domains of User-Declared Financial Preferences (2.C) and User-Defined Allocation Constraints (3.C) were deemed medium relevance, as the concept of users applying their own intuition to override AI is analogous to how they might apply personal financial rules. Domains like Expense Categorization (3.A, 3.B) and Predictive Modeling (6.A, 6.B) were considered low relevance because the paper does not address specific financial domains or algorithms. The paper provides contextual relevance to Budget Recommendation (7.B) as a broad area. Overall, the paper's primary value to Odin lies in its insights into user behavior and decision-making, rather than specific financial algorithms.
limitations:
  - "Participants were not domain experts in the tasks, which may affect the transferability of findings to expert users."
  - "The study did not explore how explanations impact user trust or satisfaction over time."
  - "The think-aloud method may not fully capture the decision-making process in a natural, low-stakes setting. [unacknowledged]"
