title: "FROM SURGE TO STABILITY: DIGITAL PAYMENTS DRIVING A STEADY TRANSITION"
authors: "Mesina-Romero, B.; Masangkay, M.; Franco, M.; Yambao, M.; Delgado, K.; Bueno, P.; Lingat, P.; Natividad, G.; Lapus, A.; Manuel, R.; Yñigo, K."
