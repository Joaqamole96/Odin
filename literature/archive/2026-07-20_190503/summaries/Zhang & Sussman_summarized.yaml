tldr: Lower income predictability correlates with lower financial wellbeing, but budgeting attenuates this negative relationship; however, those with unpredictable incomes are less likely to budget.
problem_and_motivation: Income unpredictability threatens household economic stability, yet its specific relationship with budgeting behavior and financial wellbeing is not well understood. This gap is important for designing effective financial management interventions and policy reforms.
approach:
  - Survey administered to a nationally-representative panel of 3826 U.S. adults through Lucid.
  - Measured income predictability on a 7-point Likert scale from “Completely Unpredictable” to “Completely Predictable”.
  - Assessed financial wellbeing via asset holdings, savings, confidence in handling emergencies, and a perceived wellbeing index.
  - Examined budgeting status, formal vs. informal budgeting, and reasons for not budgeting or finding it unpleasant.
  - Used interval and OLS regressions controlling for demographics, income, and pay frequency to isolate the effect of income predictability.
findings:
  - num: Those with the least predictable incomes hold roughly $10,400 less in assets and save about $93 less per month than those with the most predictable incomes.
  - num: Budgeting reduces the negative effect of income unpredictability on perceived wellbeing by 26% to 58%.
  - num: Respondents with the lowest income predictability are 14 percentage points less likely to budget than those with the highest predictability, a 20% relative decrease.
  - Those with unpredictable incomes are more likely to cite practical barriers like budgeting being "too difficult" or "unpleasant" rather than seeing it as useless.
  - The gap in financial wellbeing between those with predictable and unpredictable incomes widens with higher household income.
  - For those who budget, lower income predictability is associated with less use of fixed spending categories and more malleable categorization.
key_figures_tables:
  - Figure 1: Distribution of income predictability scores showing 75% report predictable income, 25% experience some unpredictability.
  - Figure 2: Asset levels by predictability quartile showing those with least predictable income have less assets; gap driven by higher-income households.
  - Figure 6: Likelihood of budgeting by predictability quartile showing a 13-percentage-point gap between lowest and highest quartiles.
  - Figure 7: Reasons for not budgeting; those with unpredictable income cite difficulty and unpleasantness; those with predictable income cite no need.
  - Table 3: Interval regression estimates showing assets are $10,424 lower for those in the lowest predictability quartile (p<0.001).
key_equations:
  - equation: Y_i = α + X'_i γ + β_1 Quartile1_i + β_2 Quartile2_i + β_3 Quartile3_i + ε_i
    explanation: Baseline regression for outcomes by income predictability quartile.
  - equation: Y_i = α + X'_i γ + β_1 Budgets_i + β_2 Predictable_i + β_3 Predictable_i × Budgets_i + ε_i
    explanation: Regression assessing budgeting's moderation of predictability's effect.
definitions:
  - term: Income predictability
    definition: Self-reported degree to which a household can anticipate its income from month to month.
  - term: Financial wellbeing
    definition: Composite measure of perceived financial security, stress, and confidence.
  - term: Formal budgeting
    definition: Keeping a budget written down or on a website/app.
  - term: Informal budgeting
    definition: Keeping a budget mentally, without a written record.
