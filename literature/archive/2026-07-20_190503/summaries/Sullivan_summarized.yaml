tldr: "Explainability complexity exhibits an inverted-U relationship with trust, understanding, and perceived reliability in AI-assisted decision-making, with over-reliance emerging from miscalibrated confidence and insufficient engagement."
problem_and_motivation: "AI systems often operate as opaque black boxes, limiting user ability to evaluate outputs and leading to issues of mistrust or over-reliance. Users require explanations that allow for shared understanding, trust calibration, and informed decision-making. Yet the optimal level of explanation complexity that fosters calibrated trust without inducing cognitive overload remains unclear."
approach:
  - "Three-study series: Study 1 surveyed 377 participants across low/medium/high explanation complexity levels and five decision scenarios."
  - "Study 2 constructed an Over-Reliance Index (ORI) from perceptual survey items and identified predictors using regression and cluster analysis."
  - "Study 3 (CLEAR-Engage) used a simulated hostage-rescue task with behavioral measures (agreement with AI, error detection) and self-report measures."
  - "Mixed design with explanation complexity as a between-subjects factor and scenario context as a within-subjects factor."
  - "Participants rated trust, perceived reliability, confidence, and understanding for each AI-assisted scenario."
  - "Behavioral ORI captured agreement with AI recommendations and detection of AI errors during decision-making tasks."
  - "Perceptual ORI combined measures of AI agreement and information-seeking behavior to identify over-reliance."
  - "Cluster analysis of perceptual ORI items identified three distinct reliance groups: Skeptical, Balanced, and Over-Reliant."
findings:
  - "num: 31% of participants consistently over-relied on AI recommendations regardless of explanation complexity."
  - "Low explanation complexity led to lower understanding and confidence but higher perceived reliability."
  - "High complexity explanations increased cognitive load and paradoxically reduced trust and perceived reliability."
  - "Medium complexity explanations yielded the highest trust, perceived reliability, and understanding across most scenarios."
  - "Scenario context moderated effects: high-stakes scenarios showed stronger sensitivity to explanation complexity."
  - "Information-seeking behavior negatively correlated with over-reliance, suggesting active engagement mitigates blind acceptance."
  - "Habitual AI use positively predicted over-reliance, indicating repeated exposure may reduce critical evaluation."
  - "Perceptual and behavioral ORI scores demonstrated convergent validity (r = 0.42, p < .01), supporting the index's utility."
key_figures_tables:
  - "Figure 3.1: Means and SDs for trust, reliability, confidence, understanding across complexity levels → Medium complexity optimizes all outcomes."
  - "Figure 3.2: Effects of explanations across scenarios → Context moderates the impact of complexity."
  - "Figure 4.1: Distribution of ORI scores → Scores are normally distributed with a slight positive skew."
  - "Figure 4.4: Raincloud plot of 3 reliance groups → Distinct Skeptical, Balanced, and Over-Reliant clusters identified."
  - "Table 4.3: Agreement rates by explanation level → Agreement increased from 62% (low) to 78% (high)."
key_equations:
  - equation: "ORI = Z(Agreement) + Z(InfoSeeking) + Z(HabitualUse)"
    explanation: "Over-Reliance Index combining agreement, information-seeking, and habitual use."
definitions:
  - term: "XAI"
    definition: "Explainable Artificial Intelligence – approaches to make AI decisions transparent and understandable."
  - term: "ORI"
    definition: "Over-Reliance Index – a composite measure of perceptual or behavioral over-reliance on AI."
  - term: "CLT"
    definition: "Cognitive Load Theory – framework describing mental effort and working memory capacity limitations."
  - term: "CLEAR"
    definition: "Comprehending Levels of Explainability and AI Recommendations – the study series."
