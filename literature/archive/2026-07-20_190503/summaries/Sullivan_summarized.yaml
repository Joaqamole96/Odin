  contribution: "The CLEAR study series provides a validated Over-Reliance Index (ORI) for measuring user reliance on AI recommendations, which can be adapted for Odin's budget recommendation and anomaly detection modules. The finding that medium complexity explanations optimize trust and understanding directly informs Odin's explanation design for budget recommendations. The cluster analysis methodology offers a template for classifying Odin users into distinct reliance groups to tailor explanation complexity. The simulated decision-making task design demonstrates how behavioral markers of over-reliance can be operationalized for evaluating Odin's user engagement. The framework linking explanation complexity to trust calibration and cognitive load provides theoretical grounding for Odin's user experience design."
  directly_justifies:
    - "Medium complexity explanations produce optimal trust, understanding, and perceived reliability."
    - "Information-seeking behavior negatively predicts over-reliance and can serve as an engagement metric."
    - "Habitual AI use positively predicts over-reliance, informing onboarding and calibration strategies."
    - "Cluster analysis can identify distinct user reliance profiles for personalized explanation delivery."
  limits:
    - "Scenarios were generic decision tasks, not specifically financial management contexts."
    - "The hostage-rescue task may not fully generalize to personal finance decision-making."
    - "Self-report measures may not fully capture actual reliance behaviors in real-world settings."
  mapping_rationale: "A systematic scan across all 12 functional domains and their associated topic codes was conducted. The domains flagged as relevant were: Behavioral Profiling & Classification (5.A, 5.C) due to the reliance profile identification and cluster analysis; User Retention & Engagement (11.A, 11.B) due to information-seeking behavior and explanation preferences directly informing engagement design; and System Evaluation (12.A, 12.B, 12.C) due to the ORI providing a validated evaluation framework. The paper was considered but rejected for Expense Categorization (3.A) because it does not address categorization frameworks; for Forecasting (6.A) because no predictive modeling is evaluated; for Budget Recommendation (7.A) because no optimization algorithms are proposed; and for Mobile-First Design (9.A) because the studies used desktop-based scenarios. The borderline case of 5.A and 5.C was resolved by selecting both codes, as the cluster analysis classifies users into behavioral profiles (5.A) and demonstrates a classification approach (5.C). Overall, the paper provides medium to high relevance to Odin's behavioral profiling, engagement design, and evaluation domains, with direct applicability to explanation design and user reliance measurement."
limitations:
  - "The sample was predominantly young adult students, limiting generalizability to broader populations."
  - "The hostage-rescue task may not capture the full complexity of real-world decision-making."
  - "Explanation manipulation was based on narrative descriptions rather than interactive XAI interfaces."
  - "Long-term effects of explanation complexity on trust calibration were not assessed. [unacknowledged]"
