tldr: A comprehensive survey of five primary clustering methodologies detailing their limitations, including geometric constraints, initialization sensitivity, and the curse of dimensionality, and presenting advanced solutions like dimensionality reduction, ensemble methods, and online clustering.
problem_and_motivation: Clustering algorithms, while fundamental to unsupervised learning, struggle with high-dimensional, noisy, and large-scale data. Previous surveys are outdated given rapid advancements, creating a need for a comprehensive analysis of contemporary techniques, their limitations, and innovative solutions.
approach:
  - Systematically reviewed literature from Google Scholar, PubMed, and IEEE Xplore using Boolean operators on terms like "clustering algorithms" and "k-means clustering".
  - Analyzed five primary methodologies: centroid-based (k-means), hierarchical (HAC), density-based (DBSCAN, OPTICS, HDBSCAN), distribution-based (GMM), and graph-based (spectral clustering).
  - Evaluated deep embedded clustering (DEC) as a state-of-the-art approach integrating autoencoders with clustering.
  - Identified key challenges such as geometric constraints, sensitivity to initialization, the curse of dimensionality, and handling noisy and imbalanced data.
  - Proposed advanced solutions including dimensionality reduction (PCA, t-SNE, UMAP), ensemble clustering, balanced loss functions, and model drift detection.
findings:
  - K-means clustering assumes spherical clusters and uniform variance, making it ineffective for non-spherical or elongated data shapes.
  - DBSCAN is resilient to noise and can identify clusters of arbitrary shapes but struggles with varying densities and parameter sensitivity.
  - GMMs offer probabilistic membership and adaptability to complex distributions but are limited by the Gaussian assumption and are computationally intensive.
  - Spectral clustering effectively identifies non-globular clusters but is computationally demanding with O(n^3) complexity and struggles with varying densities.
  - Deep embedded clustering (DEC) addresses the curse of dimensionality but is sensitive to initial weights and computationally intensive.
  - The curse of dimensionality diminishes the effectiveness of distance metrics, impacting centroid-based and connectivity-based models.
findings:
  - "num: K-means clustering has a time complexity of O(kndi), making it suitable for large datasets but sensitive to initial centroid placement."
  - "num: DBSCAN has an average time complexity of O(n log n) with spatial indexing, allowing it to handle large datasets efficiently."
  - "num: Spectral clustering has a worst-case time complexity of O(n^3), limiting its application to large datasets."
  - "num: Hierarchical agglomerative clustering (HAC) has a basic time complexity of O(n^3), reducible to O(n^2 log n) with optimized data structures."
  - "num: GMM time complexity is O(I * K * N * D^2), which grows quadratically with data dimensionality."
key_figures_tables:
