  - "Figure 2: DBSCAN mechanics classifying core, border, and noise points → Shows robustness to noise and ability to form arbitrarily shaped clusters."
  - "Figure 3: DBSCAN vs. OPTICS classification → Highlights OPTICS' ability to handle varying densities using reachability plots."
  - "Figure 4: K-means with and without Voronoi diagrams → Illustrates spherical cluster assumptions and areas of influence for centroids."
  - "Figure 5: K-means vs. DBSCAN on complex data → Compares spherical vs. density-based clustering, showing DBSCAN's adaptability."
  - "Figure 6: Spectral vs. K-means on concentric circles → Demonstrates spectral clustering's capability for non-linearly separable structures."
  - "Figure 7: K-means vs. GMM on S-curve data → Shows GMM's probabilistic approach adapts flexibly to non-linear distributions."
  - "Figure 8: Progressive addition of noise to clusters → Illustrates K-means vulnerability to noise, dragging centroids and overestimating clusters."
  - "Figure 9: Contrasting K-means and GMM on multimodal data → GMM effectively captures ellipsoidal components, showcasing its flexibility."
  - "Figure 14: Algorithm suitability heat map → Provides a comparative analysis of algorithms against criteria like noise tolerance and computational complexity."
key_equations:
  - equation: "$J = \\sum_{i=1}^{k} \\sum_{x \\in S_i} ||x - \\mu_i||^2$ where $\\mu_i = \\frac{1}{|S_i|} \\sum_{x \\in S_i} x$ and $i = \\text{argmin}_j ||x - \\mu_j||^2$"
    explanation: "K-means objective function: minimizes within-cluster sum of squares."
  - equation: "$\\text{Gap}(k) = \\frac{1}{B} \\sum_{b=1}^{B} \\log(W_k^b) - \\log(W_k)$"
    explanation: "Gap statistic estimates optimal cluster count by comparing dispersion."
definitions:
  - term: "DBSCAN"
    definition: "Density-Based Spatial Clustering of Applications with Noise; forms clusters based on dense regions separated by sparse areas."
  - term: "GMM"
    definition: "Gaussian Mixture Model; a probabilistic model assuming data is generated from a mixture of Gaussian distributions."
  - term: "HAC"
    definition: "Hierarchical Agglomerative Clustering; a bottom-up approach that merges data points into clusters based on similarity."
  - term: "DEC"
    definition: "Deep Embedded Clustering; integrates autoencoders with clustering to learn latent representations and cluster assignments jointly."
  - term: "t-SNE"
    definition: "t-distributed Stochastic Neighbor Embedding; a non-linear technique for visualizing high-dimensional data by preserving local structures."
  - term: "UMAP"
    definition: "Uniform Manifold Approximation and Projection; a dimensionality reduction technique that preserves both local and global data structure."
