  - "12.B"
tldr: "A systematic review of GAN variants for time series data, categorizing them into discrete and continuous variants, and covering architectures, applications, evaluation metrics, and privacy preservation techniques."
problem_and_motivation: "Time series data generation faces challenges related to data shortage, corruption, privacy, and evaluation. GANs offer a promising solution for generating high-quality, diverse, and private time series data, but a comprehensive review focusing on their application to this domain was lacking."
approach:
  - "Categorizes time series GANs into discrete-variant and continuous-variant architectures based on data type."
  - "Reviews state-of-the-art GAN models including SeqGAN, Quant GAN, C-RNN-GAN, TimeGAN, and RCGAN."
  - "Discusses architectural innovations and loss function modifications to address training instability."
  - "Presents a summary of evaluation metrics used for time series GANs, such as MMD, DTW, and TSTR."
  - "Analyzes privacy preservation methods including differential privacy and federated learning."
findings:
  - "num: TimeGAN demonstrated improvements over other state-of-the-art time series GANs like RCGAN, C-RNN-GAN, and WaveGAN."
  - "GANs are effective for data augmentation, imputation, denoising, and anomaly detection in time series."
  - "The 'best' GAN architecture and objective function is application-specific and not yet determined."
  - "Training stability, evaluation, and privacy risk remain the three main challenges in the area of time series GANs."
  - "The review highlights the lack of standardized datasets and evaluation metrics for time series GANs."
key_figures_tables:
  - "Table 1: Lists popular datasets used in reviewed works, showing data type, instances, and attributes."
  - "Figure 9: Illustrates the TimeGAN architecture combining unsupervised GAN training with supervised learning."
  - "Figure 13: Shows an example of real ECG data compared to data generated by a multivariate GAN."
  - "Table 3: Compares performance of various GAN architectures for sine wave generation using MMD, DTW, and MSE."
  - "Table 4: Compares performance of various GAN architectures for ECG generation using MMD, DTW, and MSE."
key_equations:
  - equation: "x_{t+1} = c + θ_1 x_t + θ_2 x_{t-1} + ϵ"
    explanation: "Classic autoregressive model for time series forecasting."
  - equation: "\\min_G \\max_D V(G,D) = \\mathbb{E}_{x \\sim p_{data}(x)}[\\log D(x)] + \\mathbb{E}_{z \\sim p_z(z)}[\\log(1 - D(G(z)))]"
    explanation: "Original GAN value function defining the minimax game."
  - equation: "L_G = -\\mathbb{E}_{x \\sim p_g}[\\log D(x)]"
    explanation: "Generator loss function to avoid vanishing gradients."
definitions:
  - term: "GAN"
    definition: "Generative Adversarial Network; a model with a generator and discriminator trained adversarially."
  - term: "Time Series"
    definition: "A sequence of vectors dependent on time, which can be discrete or continuous."
  - term: "SeqGAN"
    definition: "Sequence GAN; a framework for generating discrete sequential data using a policy gradient."
  - term: "TimeGAN"
    definition: "Time-series Generative Adversarial Network; combines unsupervised GAN training with supervised autoregressive modeling."
  - term: "MMD"
    definition: "Maximum Mean Discrepancy; a two-sample test for comparing distributions."
  - term: "DTW"
    definition: "Dynamic Time Warping; an algorithm for measuring similarity between temporal sequences."
critical_citations:
  - "[Goodfellow et al., 2014] — Introduced the original GAN framework."
  - "[Yu et al., 2017] — Proposed SeqGAN for discrete sequential data generation."
  - "[Mogren, 2016] — Proposed C-RNN-GAN, one of the first GANs for continuous sequential data."
  - "[Yoon et al., 2019] — Proposed TimeGAN for generating time series with preserved temporal dynamics."
  - "[Esteban et al., 2017] — Proposed RCGAN for generating real-valued medical time series."
