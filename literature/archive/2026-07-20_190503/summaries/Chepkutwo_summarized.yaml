definitions:
  - term: USSD
    definition: Unstructured Supplementary Service Data, a text-based protocol for mobile services that works without internet.
  - term: ROSCA
    definition: Rotating Savings and Credit Association, an informal group where members pool savings and take turns receiving funds.
  - term: Agent network
    definition: Decentralized system of local intermediaries who facilitate mobile money transactions and user support.
  - term: KYC
    definition: Know Your Customer, regulatory identity verification processes.
