  contribution: This paper justifies Odin's use of agent-like human touchpoints for onboarding and trust-building, especially for users with low digital literacy. Its emphasis on community-based savings informs Odin's savings modules that allow group savings and rotating funds. The paper's design principles for offline-resilient and low-bandwidth interfaces directly support Odin's mobile-first architecture for the Philippine context. Additionally, the focus on transparent transaction confirmations and conflict resolution mechanisms can guide Odin's trust and security features.
  directly_justifies:
    - Agent networks can serve as human intermediaries to increase trust in digital finance.
    - Community-based savings groups (ROSCAs) can be digitized to enhance engagement.
    - Designing for distrust with confirmation steps reduces user errors and builds confidence.
    - Frugal design from constraints leads to simpler, more inclusive user interfaces.
  limits:
    - The paper is a conceptual essay with no empirical validation of its recommendations.
    - It focuses on African and UK contexts, not directly on the Philippines.
    - It does not address specific technical algorithms or data privacy regulations.
  mapping_rationale: A systematic scan across all 12 functional domains identified strong relevance to mobile-first design (9.A, 9.B), user trust (10.B), and gaps in existing systems (4.B). The paper also touches on savings and debt management (13.A, 13.C) through community savings and micro-loans, and engagement (11.A, 11.B) via social embeddedness. Filipino cultural context (2.A) was considered but only as a contextual case, as the paper focuses on African practices; thus assigned low relevance. Domains related to forecasting, anomaly detection, and budgeting (6.A, 7.A, 8.A) were rejected due to no direct coverage. Overall, the paper provides valuable design inspiration for Odin's user experience and trust-building strategies.
limitations:
  - The paper does not provide empirical data on UK adoption of these models.
  - It assumes regulatory flexibility that may not apply in the Philippines.
  - The recommendations are broad and lack specific implementation details.
  - It does not address algorithmic aspects of personal finance management [unacknowledged].
