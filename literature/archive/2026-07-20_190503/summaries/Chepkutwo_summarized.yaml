tldr: African mobile money models demonstrate community-led design, trust-building through human agents, and frugal innovation that UK fintechs can adopt to improve financial inclusion and resilience.
problem_and_motivation: UK fintechs often overlook innovations from the Global South, assuming a West-to-East flow of knowledge. Yet African mobile money systems have solved challenges of digital exclusion, trust, and irregular income that UK fintechs now face. The paper argues that reversing this narrative can unlock inclusive and resilient financial services.
approach:
  - Conceptual analysis of African mobile money platforms including M-Pesa, MTN MoMo, and Airtel Money.
  - Comparative discussion of UK fintech shortcomings in serving vulnerable populations.
  - Synthesis of design principles from agent networks, USSD interfaces, and community-based savings models.
  - Policy recommendations for UK regulators based on African regulatory flexibility.
findings:
  - "num: Over 80% of Kenyan adults have access to mobile money services like M-Pesa."
  - Agent networks of over 180,000 in Kenya serve as human intermediaries bridging digital and physical access.
  - Designing for distrust with recipient confirmation and transaction previews builds user confidence.
  - Frugal design born from infrastructure constraints yields simpler, more inclusive interfaces.
  - Community-based savings groups (ROSCAs) digitized in mobile money platforms increase engagement and trust.
