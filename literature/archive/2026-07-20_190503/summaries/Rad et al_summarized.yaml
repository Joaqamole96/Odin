title: Modeling Investment Decisions Through Decision Tree Regression—A Behavioral Finance Theory Approach
authors: Rad, D.; Cuc, L.D.; Croitoru, G.; Gomoi, B.C.; Mazuru, L.; Bilti, R.S.; Rusu, S.; Sinaci, M.; Barbu, F.S.
year: 2025
venue: Electronics
