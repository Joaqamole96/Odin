tldr: "E-wallet usage positively correlates with increased consumptive behavior among Generation Z, driven by convenience, promotions, and reduced payment friction."
problem_and_motivation: "E-wallets are widely adopted by Generation Z, yet their impact on financial behavior is not fully understood. The convenience of digital payments may foster impulsive consumption and weaken financial discipline among young users. This gap motivates a systematic review of empirical evidence linking e-wallet use to spending habits."
approach:
  - "Systematic literature review following the PRISMA framework."
  - "Searched Scopus, Web of Science, ScienceDirect, ProQuest, and Google Scholar for publications from 2020 to 2025."
  - "Included 28 empirical, peer-reviewed studies focusing on Generation Z (ages 18-27) and e-wallet spending behavior."
  - "Excluded theoretical papers and studies on older demographics."
  - "Synthesized findings to identify recurring themes and behavioral patterns."
findings:
  - "num: Strong positive correlation between e-wallet usage frequency and increased spending."
  - "num: Studies reported a noticeable increase in daily or weekly transactions among frequent e-wallet users."
  - "E-wallets reduce the 'pain of paying,' leading to more impulsive purchases."
  - "Promotional features like cashback and discounts significantly influence consumer decision-making."
  - "Behavioral design elements such as push notifications and gamification reinforce spending habits."
  - "Most e-wallet applications lack integrated budgeting tools, contributing to financial oversight."
  - "Financial literacy acts as a moderating factor, with lower literacy linked to higher overspending."
  - "Gender and geographic variations exist in spending patterns."
  - "Digital nudges in e-wallets often prioritize spending over saving."
  - "Urban Gen Z users exhibit higher transactional frequency than rural users."
