  - "Convenience and digital promotions are major drivers of increased spending."
  - "Most e-wallet apps lack budgeting tools, leading to financial oversight."
  - "Behavioral design features can be leveraged for saving, not just spending."
  - "Financial literacy is a key moderator of e-wallet spending behavior."
