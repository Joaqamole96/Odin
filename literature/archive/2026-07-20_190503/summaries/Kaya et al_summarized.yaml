title: Explainable Artificial Intelligence (XAI): Concepts, Applications, Challenges, and Future Perspectives
authors: Kaya, O.; Shahenshah, A. F. M.; Karabulut, M. A.; Karahan, S. N.; Osmanca, M. S.; Acır, N.
year: 2026
venue: IEEE Access
odin_topics:
