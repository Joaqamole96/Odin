definitions:
  - term: WEIRD
    definition: Western, Educated, Industrialized, Rich, and Democratic populations that are overrepresented in research but do not represent the global majority.
  - term: Global South
    definition: Nations generally less economically developed, often with a history of colonization, facing systemic disadvantages in global knowledge production.
  - term: Global North
    definition: Wealthier, more industrialized countries, often historically characterized by colonialism, with significant economic and educational advantages.
  - term: Intellectual Extractivism
    definition: The act of extracting knowledge from one culture or community without adequate recognition, compensation, or benefit to the source.
  - term: Epistemologies
    definition: Theories of knowledge and ways of knowing, including local and indigenous knowledge systems.
