tldr: Reviews systemic inequities in cross-cultural psychology, highlighting how Western-centric methodologies marginalize Global South perspectives and proposing collaborative strategies for a more inclusive discipline.
problem_and_motivation: Cross-cultural psychology is historically dominated by Western perspectives, methodologies, and interests, often at the expense of non-Western cultures and knowledge systems. This imbalance narrows the scope of psychological inquiry, limits understanding of global human experiences, and perpetuates intellectual extractivism. A critical review is needed to assess and address this imbalance, ensuring the field evolves to be more representative and inclusive.
approach:
  - This is a review paper synthesizing existing literature to critique the state of cross-cultural psychology.
  - The authors use a conceptual framework centered on the Global North-South dichotomy to analyze systemic inequalities.
  - They examine historical legacies of colonialism and contemporary challenges like intellectual extractivism and representation issues.
  - The review integrates evidence of underrepresentation, such as studies showing over 95% of samples are from WEIRD societies.
  - Proposes actionable strategies for equitable collaboration and knowledge co-production between Global North and South scholars.
findings:
  - num: Over 95% of psychological samples from 2003-2018 were drawn from WEIRD societies.
  - The predominance of Western research methodologies marginalizes Global South scholars and indigenous ways of knowing.
  - Intellectual extractivism in research practices raises significant ethical concerns.
  - Systemic inequalities, such as disparities in editorial board representation and longer review periods, hinder participation from non-Western scientists.
  - Publication disparities and article processing charges pose significant financial barriers for researchers from the Global South.
  - Authorship attribution often fails to equitably recognize the critical contributions of local scholars in cross-cultural research.
