tldr: An example-dependent cost-sensitive selective deep ensemble model using TabNet and GMDH neural networks improves credit scoring performance and interpretability.
problem_and_motivation: Existing credit scoring models often ignore varying misclassification costs between individual samples and lack interpretability, limiting practical business application. Class-dependent cost-sensitive methods fail to capture the financial impact of lending to different customers.
approach:
  - Constructs an example-dependent cost matrix for each borrower based on credit limit and loan details.
  - Trains multiple ECS TabNet base classifiers using an enhanced loss function that prioritizes minority-class (high-risk) samples.
  - Proposes a new example-dependent cost-sensitive symmetric criterion (ECS-SC) for the GMDH neural network.
  - Uses the ECS GMDH to perform selective deep ensemble of the base classifiers, reducing model redundancy.
  - Evaluates performance on four public credit scoring datasets using statistical and cost-oriented metrics.
findings:
  - num: The ECS-SDE model achieved 45.45% cost savings on the GMSC dataset.
  - num: The ECS-SDE model achieved 51.26% cost savings on the IEEE dataset.
  - The model outperformed six cost-sensitive and five deep ensemble models across most evaluation metrics.
  - ECS-SDE showed significant advantages in BS+, Save, and AUC metrics on multiple datasets.
  - Age, debt ratio, and overdue history were identified as the most important features for credit scoring.
  - The combination of ECS TabNet and ECS GMDH was critical to maximizing model performance.
  - The model provides strong interpretability through feature importance analysis and network structure visualization.
  - Example-dependent cost-sensitive methods outperform class-dependent ones in credit scoring.
  - Using TabNet as a base classifier improves performance on tabular data without extensive preprocessing.
key_figures_tables:
  - Table 3: Dataset description including sample counts, features, and imbalance ratios → Provides context for evaluating model performance across varied data.
  - Table 7: Comparison of ECS-SDE with seven cost-sensitive models → ECS-SDE achieves the best average ranking across all metrics.
  - Table 10: Comparison of ECS-SDE with five deep ensemble models → ECS-SDE achieves the highest cost savings and AUC-PR scores.
  - Figure 5: Global feature importance plot on the GMSC dataset → Identifies Age, Debt Ratio, and overdue history as key credit scoring factors.
key_equations:
  - equation: "$Loss_{cost}(y_i, \\hat{y}_i) = \\sum_{x \\in D_{maj}} Cost_{maj}(y_i, \\hat{y}_i) + \\sum_{x \\in D_{min}} Cost_{min}(y_i, \\hat{y}_i)$"
    explanation: "ECS loss function for TabNet training, weighting minority-class samples by 5x."
  - equation: "$Cost(D_{input}) = Cost(A) + Cost(B)$"
    explanation: "ECS-SC external criterion for GMDH selective ensemble optimization."
definitions:
  - term: ECS
    definition: "Example-dependent cost-sensitive learning, where misclassification costs vary by sample."
  - term: TabNet
    definition: "Attentive interpretable tabular deep neural network for handling tabular data."
  - term: GMDH
    definition: "Group method of data handling, a self-organizing inductive modeling technique."
  - term: ECS-SC
    definition: "Example-dependent cost-sensitive symmetric criterion for GMDH model selection."
