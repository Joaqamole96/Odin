  - 12.B
tldr: A genetic algorithm combined with decision trees optimizes cost-sensitive SVM hyper-parameters for imbalanced data, reducing computational time.
problem_and_motivation: Hyper-parameter optimization for machine learning models is computationally expensive, especially for imbalanced datasets where accuracy is a misleading metric. Existing grid search methods are time-consuming, and there is a need for efficient tuning methods that optimize multiple performance measures simultaneously.
approach:
  - Formulated hyper-parameter tuning for cost-sensitive SVM as a multi-objective optimization problem.
  - Optimized three objective functions: accuracy, G-Mean, and average cost.
  - Used NSGA-II as the base genetic algorithm for multi-objective optimization.
  - Proposed an improved version that uses a decision tree to predict fitness values of similar chromosomes, reducing the number of k-fold cross-validations.
  - Tested both serial and parallel versions on six imbalanced benchmark datasets from the UCI repository.
findings:
  - num: The proposed approach achieved accuracy values of up to 97.42% on the WDBC dataset.
  - num: G-Mean values reached up to 97.73% on the WDBC dataset.
  - num: The improved algorithm reduced computational time by over 70% in some experiments compared to the basic genetic algorithm approach.
  - Accuracy is not a suitable measure for imbalanced data; G-Mean and balanced accuracy are more appropriate.
  - The proposed approach found similar or better hyper-parameters than other methods in the literature.
key_figures_tables:
  - "Table 4: Best metric values by optimized hyper-parameters → The proposed method achieves competitive or superior results on several datasets."
  - "Figure 6: Performance measures of Pareto points for four datasets → Balanced accuracy and sensitivity show trade-offs for imbalanced data."
  - "Figure 7: Performance measures of Pareto points for two datasets → Highlights the challenge of achieving high sensitivity on highly imbalanced datasets."
key_equations:
  - equation: "$min \\frac{1}{2}||w||^2 + C[C_1 \\sum_{i|y_i=1} \\xi_i + C_{-1} \\sum_{i|y_i=-1} \\xi_i]$"
    explanation: Cost-sensitive SVM objective function.
  - equation: "$f_1 = max \\frac{TP+TN}{TP+FP+TN+FN}$"
    explanation: Objective function for accuracy.
  - equation: "$f_2 = max \\sqrt{Sensitivity \\times Specificity}$"
    explanation: Objective function for G-Mean.
  - equation: "$f_3 = min \\frac{C_1 \\times FN + C_2 \\times FP}{TP+TN+FP+FN}$"
    explanation: Objective function for average cost.
definitions:
  - term: CS-SVM
    definition: Cost-sensitive Support Vector Machine, which uses different penalty coefficients for misclassifying different classes.
  - term: G-Mean
    definition: Geometric mean of sensitivity and specificity, a balanced performance measure for imbalanced data.
  - term: NSGA-II
    definition: Non-dominated Sorting Genetic Algorithm II, a multi-objective evolutionary algorithm.
  - term: IR
    definition: Imbalance Ratio, the ratio of the number of minority instances to majority instances.
