title: Post-Pandemic Labor Market Transformation: The Rise of the Gig Economy and Youth Employment in Southeast Asia
authors: Nguyen Thi Minh Phuong, Carlos Antonio Cruz, Rini Andriani Pratiwi
year: 2026
