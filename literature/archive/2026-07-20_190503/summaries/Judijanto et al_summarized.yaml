
paper_id: 10.35335/ijobas.v13i1.470
designation: international-algorithm-specific
title: Early warning systems for financial distress: A machine learning approach to corporate risk mitigation
authors: Judijanto, L.; Sihotang, J.; Simbolon, A. P. H.
year: 2024
venue: International Journal of Basic and Applied Science
odin_topics:
  - 6.A
  - 6.B
  - 8.B
  - 12.A
  - 12.B
tldr: Integrates financial and non-financial data with ensemble learning to predict corporate distress, addressing class imbalance and interpretability for early warning systems.
problem_and_motivation: Traditional financial distress models fail to capture non-linear relationships and non-financial factors. Machine learning offers potential for more accurate, dynamic predictions but faces gaps in feature selection, class imbalance, and model interpretability.
approach:
  - Collects comprehensive financial and non-financial data from public sources.
  - Preprocesses data through cleaning, handling missing values, and normalization.
  - Performs feature selection using ensemble methods to identify relevant predictors.
  - Develops machine learning models including logistic regression, random forests, gradient boosting, and neural networks.
  - Evaluates model performance using accuracy, precision, recall, F1-score, and AUC-ROC, with a focus on class imbalance via cost-sensitive learning.
findings:
  - num: Basic logistic regression on simulated data achieved 0% accuracy, precision, recall, and F1-score.
  - Traditional statistical models like logistic regression struggle with imbalanced datasets.
  - Ensemble learning methods like random forests and gradient boosting offer superior predictive accuracy.
  - Machine learning can integrate both financial and non-financial data for a holistic view of corporate health.
  - Cost-sensitive learning is more effective than basic resampling for handling class imbalance.
key_figures_tables:
  - Table 1: Dataset with financial features (liquidity, leverage, profitability, market sentiment) and binary distress outcome → Example of input features.
  - Table 2: Predicted probabilities vs. true outcomes using logistic regression → Model misclassifies most cases.
  - Table 3: Confusion matrix showing 0 true positives, 3 false positives, 0 true negatives, 2 false negatives → Poor performance of basic logistic regression.
key_equations:
  - equation: "Z = 1.2*(WC/TA) + 1.4*(RE/TA) + 3.3*(EBIT/TA) + 0.6*(MVE/TL) + 1.0*(S/TA)"
    explanation: Altman's Z-score for bankruptcy prediction using financial ratios.
  - equation: "DD = (log(A/L) + (r - 0.5*σ_A^2)*T) / (σ_A*sqrt(T))"
    explanation: Merton model's distance-to-default for structural risk assessment.
  - equation: "P(y=1|X) = σ(f(X)) = 1 / (1 + e^{-f(X)})"
    explanation: Logistic sigmoid function to convert model output to probability of distress.
definitions:
  - term: EWS
    definition: Early Warning System for predicting financial distress.
  - term: SMOTE
    definition: Synthetic Minority Over-sampling Technique for handling class imbalance.
  - term: AUC-ROC
    definition: Area Under the Receiver Operating Characteristic curve for model evaluation.
