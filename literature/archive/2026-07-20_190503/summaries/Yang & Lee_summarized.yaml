definitions:
  - term: GenAI
    definition: Generative artificial intelligence platforms capable of producing personalized, conversational financial advice through NLP and ML.
  - term: SDL
    definition: Service-dominant logic, a framework emphasizing value co-creation through provider-consumer interactions.
  - term: AIDUA
    definition: Artificial Intelligence Device Use Acceptance, a model explaining consumer acceptance of AI devices across appraisal stages.
  - term: Perceived authenticity
    definition: Consumer perception of the truthfulness, dependability, and genuineness of GenAI-provided financial advice.
  - term: Utilitarian attitude
    definition: Consumer evaluation of a technology's efficiency, effectiveness, and practical usefulness in achieving financial goals.
  - term: AI literacy
    definition: Skills and competencies needed to effectively use, understand, and interpret AI technologies and their outputs.
