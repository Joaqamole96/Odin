  contribution: The paper provides a validated model linking GenAI feature perceptions to user engagement and resistance, directly informing Odin's user trust module (10.B) and engagement dynamics (11.A). Its findings on personalization and continuous improvement justify Odin's design emphasis on adaptive, user-aware financial guidance. The AI literacy moderation effect informs Odin's onboarding and user education strategies. The SEM framework offers a methodological template for evaluating Odin's user-facing modules.
  directly_justifies:
    - "Perceived authenticity of AI financial advice is a prerequisite for user trust and engagement."
    - "Personalized recommendations and human-like empathy increase perceived authenticity of financial advice."
    - "Continuous improvement of AI systems maintains user trust over time."
    - "AI literacy amplifies the positive effects of AI features on perceived authenticity."
    - "Utilitarian attitudes mediate the relationship between authenticity and engagement or resistance."
  limits:
    - "Sample limited to mobile banking users in South Korea; may not generalize to other cultural contexts or user segments. [unacknowledged]"
    - "Cross-sectional design cannot establish causal direction of relationships. [unacknowledged]"
    - "Self-reported survey data may be subject to social desirability and recall bias. [unacknowledged]"
    - "Does not examine objective financial outcomes or actual usage behavior beyond intentions."
  mapping_rationale: Systematic scan across all 12 functional domains and their associated topic codes flagged the following as relevant: Existing Systems & Gaps (4.A, 4.B), Data Privacy & User Trust (10.B), and User Retention & Engagement (11.A, 11.B). The paper's literature review on robo-advisor limitations directly justifies 4.B (high), while the empirical model of perceived authenticity and utilitarian attitudes strongly supports 10.B (high) and 11.A (high). The findings on continuous improvement and empathetic design provide supporting evidence for 11.B (medium). The SEM methodology offers a template for 12.A (medium) but does not evaluate algorithmic modules (12.B, low) or budget-specific evaluation (12.C, not selected). Behavioral Profiling domains (5.A-5.C) were rejected as the paper does not classify user financial behaviors; Forecasting domains (6.A-6.B) were rejected as no predictive modeling is performed; Budget Recommendation domains (7.A-7.D) were rejected as budgeting is not the focus; Anomaly Detection (8.A-8.C) was rejected as the paper does not address anomaly identification; Mobile-First Design (9.A-9.B) was rejected as mobile context is incidental to the sample, not a design focus; Savings & Debt Management (13.A-13.C) was rejected as savings and debt are not addressed. Overall, the paper is highly relevant to Odin's trust, engagement, and system-gap domains, providing empirical justification for human-centered AI design principles.
