
paper_id: 10.3390/jrfm17100470
designation: international
title: Enhancing Financial Advisory Services with GenAI: Consumer Perceptions and Attitudes Through Service-Dominant Logic and Artificial Intelligence Device Use Acceptance Perspectives
authors: Yang, Q.; Lee, Y.-C.
year: 2024
venue: Journal of Risk and Financial Management
odin_topics:
  - 4.A
  - 4.B
  - 10.B
  - 11.A
  - 12.A
tldr: Personalized suggestions, human-like empathy, and continuous improvement of GenAI financial advice positively influence perceived authenticity, which fosters utilitarian attitudes that increase willingness to communicate and reduce resistance.
problem_and_motivation: Prior research on robo-advisors has largely overlooked how distinct GenAI attributes—personalization, empathy, and continuous learning—reshape consumer experiences with financial advice. A gap exists in understanding specific contributors to consumer attitudes and reactions toward GenAI-based financial guidance.
approach:
  - Survey data from 822 mobile banking users who had engaged with GenAI for financial guidance.
  - Structural equation modeling (SEM) used to test the integrated SDL and AIDUA framework.
  - Measurement model assessed via factor loadings, CR, AVE, and discriminant validity using Fornell-Larcker criterion.
  - Harman's single-factor test confirmed no common method bias (first factor accounted for 31.95% of variance).
  - Moderating effects of AI literacy on the relationship between GenAI attributes and perceived authenticity were tested.
findings:
  - num: Personalized investment suggestions positively associated with perceived authenticity (β=0.318, p<0.001).
  - num: Human-like empathy positively associated with perceived authenticity (β=0.338, p<0.001).
  - num: Continuous improvement positively associated with perceived authenticity (β=0.287, p<0.001).
  - num: Perceived authenticity positively associated with utilitarian attitudes (β=0.71, p<0.001), explaining 50.5% of variance.
  - num: Utilitarian attitudes positively associated with willingness to communicate (β=0.709, p<0.001) and negatively associated with resistance (β=-0.739, p<0.001).
  - num: AI literacy positively moderates the relationships between GenAI attributes and perceived authenticity (β=0.097 to 0.108, p<0.001).
  - The model explains 56.9% of variance in perceived authenticity, 50.3% in willingness to communicate, and 54.6% in resistance.
  - All factor loadings exceeded 0.6, Cronbach's α ranged from 0.845 to 0.949, and all AVE values exceeded 0.5.
key_figures_tables:
  - Table 1: Demographic characteristics of 822 respondents → sample balanced across gender, age, and income.
  - Table 2: Reliability, CR, and AVE for all constructs → all measures exceed recommended thresholds.
