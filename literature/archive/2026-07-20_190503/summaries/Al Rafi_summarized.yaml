tldr: Self-supervised deep learning with temporal and graph neural networks enhances fraud detection by modeling customer identity and behavioral patterns.
problem_and_motivation: Rule-based and supervised fraud detection systems fail to adapt to evolving, low-frequency fraud patterns and require extensive labeled data. This limits their effectiveness in real-world, imbalanced financial transaction environments where novel attack strategies are common.
approach:
  - A multi-stage pipeline uses self-supervised learning (contrastive learning and masked reconstruction) to pretrain on unlabeled transaction data.
  - A Temporal Transformer module captures sequential spending patterns and transaction dynamics using multi-head self-attention.
  - A Graph Neural Network (GNN) module models customer identity graphs to capture cross-account relationships and fraud rings.
  - Hybrid risk scoring combines embeddings from all modules into a stacked ensemble of XGBoost, deep neural networks, and logistic regression.
  - The system was evaluated on a large, real-world dataset with 35.2 million transactions and a fraud rate of 0.27%.
findings:
  - num: The proposed SSL+Hybrid model achieved a precision of 0.98 and recall of 0.90.
  - num: The system's F1-score of 0.96 significantly outperforms rule-based (0.28) and supervised LSTM (0.77) baselines.
  - num: Integration of the GNN identity modeling module reduced the false positive rate from 0.19 to 0.04.
  - num: A combined self-supervised learning approach produced an F1-score of 0.96, surpassing contrastive-only (0.89) or masked-only (0.88) methods.
  - Identity-aware modeling effectively detects organized fraud rings and mule networks.
key_figures_tables:
  - Table 1: Dataset statistics with 35.2M total transactions and 0.27% fraud rate → Provides context for imbalanced data evaluation.
  - Table 2: Performance comparison across baselines → Proposed model shows superior precision, recall, and F1-score.
  - Table 3: Ablation on GNN identity modeling → GNN module drastically reduces false positives.
