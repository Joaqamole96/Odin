key_equations:
  - equation: "\u2113_{contrastive} = -\u2211_{i=1}^{N} \u2211_{j\u2260i}^{N} \u2211_{a=1}^{K} \u2211_{b=1}^{K} [\u0394\u03b4]"
    explanation: Contrastive loss maximizes agreement between augmented views of same behavior.
  - equation: "Attention(Q, K, V) = \u03c3((QK^T)/\u221a{d_k})V"
    explanation: Scaled dot-product attention for temporal sequence modeling.
  - equation: "h_v^{(l+1)} = \u03c3(W^{(l)} \u2219 \u03c3(\u2211_{u\u2208N(v)} \u03b1_{uv} W^{(l)} h_u^{(l)}))"
    explanation: Graph neural network update rule with attention weights.
  - equation: "Risk Score = \u2211_{i=1}^{M} w_i P_i"
    explanation: Weighted aggregation of probabilities from the ensemble models.
definitions:
  - term: Self-Supervised Learning (SSL)
    definition: A learning paradigm that uses pretext tasks on unlabeled data to learn robust representations without explicit labels.
  - term: Graph Neural Network (GNN)
    definition: Neural network architecture designed to learn on graph-structured data, capturing relationships between nodes.
  - term: Transformer
    definition: Deep learning model based on self-attention mechanisms, used for sequential data.
  - term: GNN-Based Identity Modeling
    definition: Using graph networks to model relationships between customer accounts to detect fraud rings.
  - term: F1-Score
    definition: The harmonic mean of precision and recall, providing a single metric for model performance.
