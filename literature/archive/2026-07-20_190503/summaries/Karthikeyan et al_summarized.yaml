  contribution: This paper provides a validated methodology for integrating cost-sensitive machine learning into a real-time transaction processing pipeline, which directly informs Odin's Anomaly Detection module (8.B) by demonstrating how to prioritize fraud recall without overwhelming users with false alerts. The threshold optimization technique (7.C) offers a concrete approach for adjusting system sensitivity based on the operational costs of different error types, which is critical for Odin's budget recommendation feasibility checks. Furthermore, the paper's emphasis on system-level validation and real-time performance offers a template for evaluating Odin's algorithmic modules (12.B) under practical deployment conditions.
  directly_justifies:
    - "Cost-sensitive threshold optimization significantly improves fraud recall without increasing false alarms."
    - "Ensemble methods are robust and effective for detecting rare fraud in imbalanced transaction data."
    - "Real-time integration of detection models into transaction flows is feasible and effective."
  limits:
    - "The study relies on public datasets, which may not fully capture the evolving tactics of real-world fraud."
    - "The phishing detection component is auxiliary and not integrated with core fraud scoring."
  mapping_rationale: A systematic scan of all 12 functional domains and their associated topic codes was performed. The paper directly and strongly supports topics under Anomaly Detection (8.A, 8.B) by proposing and evaluating a specific algorithm for this purpose. It also directly justifies critiques of existing systems (4.B) and offers a robust evaluation framework (12.B). The cost-sensitive optimization approach provides a specific method relevant to Constrained Optimization (7.C). Topics related to Filipino context (1.A, 2.A) were rejected as the study uses international data and does not address cultural or behavioral specifics. Predictive Modeling (6.A) is relevant but secondary to the anomaly detection focus. Data Privacy (10.A) is contextually mentioned through security implications. The overall relevance to Odin is medium, providing a strong technical reference for building and evaluating a recall-oriented anomaly detection module, but requiring additional work to adapt to the Filipino financial context and integrate with budget recommendation.
