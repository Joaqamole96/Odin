tldr: A cost-sensitive ensemble model with optimized decision thresholds achieves high fraud recall (98.6%) for real-time online banking transaction screening.
problem_and_motivation: Existing rule-based and accuracy-focused machine learning fraud detection systems fail to adapt to new scams and overlook rare fraudulent events. Missing fraud carries far heavier financial and reputational consequences than false alarms, yet most systems do not account for this asymmetric cost structure.
approach:
  - An ensemble of Random Forest, XGBoost, and Logistic Regression classifiers is trained on imbalanced transaction data.
  - Cost-sensitive decision threshold optimization minimizes misclassification costs, prioritizing fraud recall over raw accuracy.
  - The model is integrated into a real-time transaction pipeline to block or flag fraudulent transactions before completion.
  - A supporting Chrome browser extension provides auxiliary phishing URL detection using a hybrid deep learning and heuristic model.
  - Performance is evaluated using precision-recall and ROC curves, with a focus on recall and false-positive trade-offs.
  - The system is validated on public transaction datasets with less than 1% fraud prevalence.
findings:
  - num: The proposed model achieved 98.6% recall, 96.8% precision, and an F1-score of 98.2% on the test set.
  - num: The model outperformed XGBoost with a fixed threshold (0.5), which achieved 92.4% recall and 94.1% precision.
  - num: The ROC-AUC for the proposed model was 0.996, indicating strong class separability.
  - Cost-sensitive threshold optimization effectively balances recall and precision, avoiding excessive false alarms.
  - Real-time integration ensures immediate risk mitigation without significant user-perceived latency.
  - The phishing detection component adds a supplementary layer of security by identifying malicious websites.
  - Traditional fixed rules and accuracy-focused models are inadequate for detecting rare fraud in imbalanced datasets.
key_figures_tables:
  - Table I: Performance comparison with baseline models → Proposed model achieves highest recall (98.6%) and F1-score (98.2%).
  - Figure 1: System architecture of the proposed transaction fraud detection framework → Shows integration of data processing, fraud detection engine, and real-time enforcement.
  - Figure 2: Confusion matrix of the proposed model → Demonstrates high true positive and low false negative rates.
  - Figure 3: Precision-Recall curve → Indicates consistently high precision across a wide range of recall values.
  - Figure 5: Effect of decision threshold on performance → Illustrates trade-off between detection accuracy and classification sensitivity.
key_equations:
  - equation: C(τ)=C_FN·FN(τ)+C_FP·FP(τ)
    explanation: Expected classification cost as a function of the decision threshold.
  - equation: C_FN >> C_FP
    explanation: Misclassification costs reflect higher impact of missed fraud versus false alarms.
  - equation: τ* = argmin C(τ)
    explanation: Optimal decision threshold minimizes expected misclassification cost.
definitions:
  - term: FN
    definition: False Negative, a missed fraudulent transaction.
  - term: FP
    definition: False Positive, a legitimate transaction incorrectly flagged as fraud.
  - term: AUC
    definition: Area Under the ROC Curve, a measure of class separability.
  - term: ROC
    definition: Receiver Operating Characteristic, a performance visualization tool.
  - term: PR
    definition: Precision-Recall, a performance metric suite for imbalanced datasets.
