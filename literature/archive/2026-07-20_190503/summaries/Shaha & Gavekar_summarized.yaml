  contribution: "This paper justifies the use of LightGBM for Odin's anomaly detection module due to its high recall and low false positive rate. The extraction of behavioral indicators supports feature engineering for user spending behavior. The evaluation framework with ROC-AUC and F1-score provides a benchmark for Odin's algorithmic modules. The real-time performance analysis informs deployment considerations for mobile-first PFMS. The handling of imbalanced data via SMOTE is directly applicable to Odin's rare-event detection."
  directly_justifies:
    - "LightGBM with behavioral indicators achieves 0.981 ROC-AUC for anomaly detection."
    - "Behavioral indicators like transaction frequency improve detection accuracy."
    - "Low false positive rate of 0.006 is critical for user trust in PFMS."
    - "Real-time latency of 0.58 ms enables immediate fraud flagging."
  limits:
    - "Dataset is from European cardholders, may not generalize to Filipino spending patterns."
    - "Synthetic oversampling may introduce bias."
    - "Model generalizability to other transaction types not fully validated."
  mapping_rationale: "A systematic scan of all 12 functional domains and their associated topic codes was performed. The paper was flagged as highly relevant to anomaly detection (topics 8.A and 8.B) because it directly evaluates machine learning models for identifying fraudulent transactions in spending data. It was assigned medium relevance to behavioral profiling (5.A) because it uses behavioral indicators such as transaction frequency and user interaction time, which could inform spending behavior features. Low relevance was given to algorithmic evaluation (12.B) as the paper provides a comparative evaluation framework, though this is secondary to fraud detection. Contextual relevance was assigned to existing systems and gaps (4.B) because it reviews limitations of traditional rule-based methods but does not focus on PFMS specifically. Domains related to forecasting (6), budgeting (7), expense categorization (3), mobile design (9), privacy (10), retention (11), and savings/debt (13) were rejected as the paper does not address them. The overall relevance to Odin lies in its insights for anomaly detection algorithm selection and feature engineering."
limitations:
