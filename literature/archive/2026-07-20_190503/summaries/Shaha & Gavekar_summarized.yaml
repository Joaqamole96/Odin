
paper_id: "10.1051/epjconf/202532801003"
designation: "international-algorithm-specific"
title: "Enhancing Online Fraud Detection: Leveraging Machine Learning and Behavioral Indicators for Improved Accuracy and Real-Time Detection"
authors: "Shaha, P.; Gavekar, V."
year: 2025
venue: "EPJ Web of Conferences"
odin_topics:
  - "8.A"
  - "8.B"
  - "5.A"
  - "12.B"
  - "4.B"
tldr: "Evaluates machine learning models for fraud detection, finding LightGBM with behavioral indicators achieves the highest ROC-AUC of 0.981 and F1-score of 0.902."
problem_and_motivation: "Traditional rule-based fraud detection systems are rigid, produce high false positives, and cannot adapt to evolving fraud schemes. There is a need for more accurate, real-time detection using machine learning and behavioral indicators."
approach:
  - "Used the Kaggle credit card fraud dataset with 284,807 transactions and applied SMOTE to handle class imbalance."
  - "Performed PCA and RFE for feature engineering, and extracted behavioral indicators such as transaction frequency, user interaction time, and device/location consistency."
  - "Compared Logistic Regression, Decision Tree, Random Forest, SVM, ANN, and LightGBM using accuracy, precision, recall, F1, FPR, and ROC-AUC."
  - "Evaluated real-time viability by measuring average prediction time per transaction."
  - "Selected LightGBM for its leaf-wise growth, efficient memory usage, and built-in support for imbalanced data."
findings:
  - "num: LightGBM achieved the highest ROC-AUC of 0.981, F1-score of 0.902, and lowest FPR of 0.006."
  - "num: LightGBM had precision of 0.891 and recall of 0.914, outperforming all baseline models."
  - "Behavioral indicators significantly enhanced the model's ability to detect anomalies."
  - "LightGBM maintained low latency of 0.58 ms per transaction, suitable for real-time deployment."
  - "Random Forest and ANN performed well but with higher FPR and lower recall compared to LightGBM."
key_figures_tables:
  - "Table 1: Performance metrics across six models → LightGBM outperforms all."
  - "Figure 2: ROC curves comparison → LightGBM has the highest AUC of 0.981."
  - "Table 2: Average prediction time per transaction → LightGBM runs at 0.58 ms."
key_equations:
  - equation: "Accuracy = (TP + TN) / (TP + TN + FP + FN)"
    explanation: "Overall correct predictions divided by total."
  - equation: "Precision = TP / (TP + FP)"
    explanation: "Positive predictive value."
  - equation: "Recall = TP / (TP + FN)"
    explanation: "True positive rate."
  - equation: "F1 = 2 * (Precision * Recall) / (Precision + Recall)"
    explanation: "Harmonic mean of precision and recall."
  - equation: "FPR = FP / (FP + TN)"
    explanation: "False positive rate."
  - equation: "X_new = X_i + δ * (X_k - X_i), δ ∈ [0,1]"
    explanation: "SMOTE synthetic sample generation."
  - equation: "Z = X * W"
    explanation: "PCA transformation to principal components."
  - equation: "BP = Sum of Transactions in Time Window / Time Window"
    explanation: "Behavioral pattern as transaction frequency."
definitions:
  - term: "SMOTE"
    definition: "Synthetic Minority Over-sampling Technique for balancing classes."
  - term: "PCA"
    definition: "Principal Component Analysis for dimensionality reduction."
  - term: "RFE"
    definition: "Recursive Feature Elimination for feature selection."
  - term: "LightGBM"
    definition: "Light Gradient Boosting Machine, a gradient boosting framework."
  - term: "ROC-AUC"
    definition: "Area Under the Receiver Operating Characteristic curve."
  - term: "FPR"
    definition: "False Positive Rate, proportion of negatives incorrectly classified."
