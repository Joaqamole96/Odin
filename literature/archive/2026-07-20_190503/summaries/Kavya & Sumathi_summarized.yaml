definitions:
  - term: CNN
    definition: Convolutional Neural Network, a deep learning model for image and pattern recognition.
  - term: RNN
    definition: Recurrent Neural Network, a deep learning model for sequential data.
  - term: LSTM
    definition: Long Short-Term Memory, a type of RNN that handles long-term dependencies.
  - term: GAN
    definition: Generative Adversarial Network, a framework with generator and discriminator networks.
  - term: PDGAN
    definition: Phishing Detection GAN, a GAN-based model for phishing detection.
  - term: NLP
    definition: Natural Language Processing, used for analyzing text content in emails.
  - term: FPR
    definition: False Positive Rate, the rate of benign instances misclassified as phishing.
  - term: AUC-ROC
    definition: Area Under the Receiver Operating Characteristic Curve, a metric of model performance.
