tldr: A comprehensive review of phishing detection methodologies, from traditional machine learning to deep learning and GANs, highlighting performance metrics, robustness, and open challenges.
problem_and_motivation: Phishing attacks have grown increasingly sophisticated, rendering traditional detection methods inadequate. This review addresses the need for a structured understanding of current methodologies to guide the development of more robust and adaptive cybersecurity solutions.
approach:
  - A systematic literature review of phishing detection techniques is conducted.
  - The paper categorizes methods into list-based, similarity-based, machine learning, deep learning, and GAN-based approaches.
  - Qualitative and quantitative analyses are used to compare the strengths and limitations of each method.
  - The study synthesizes findings from a wide range of recent research papers and datasets.
findings:
  - Deep learning models, especially CNNs, achieve high accuracy (98.74%) in detecting phishing attacks.
  - GAN-based models, like PDGAN, attain 97.58% accuracy and demonstrate strong adversarial robustness.
  - Ensemble learning techniques improve detection accuracy and resilience against adversarial attacks.
  - GANs effectively generate synthetic phishing samples to address data scarcity and model generalization.
  - Robustness against adversarial attacks and concept drift remains a critical, unresolved challenge.
